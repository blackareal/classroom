<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>เช็คชื่อ — อ.อนุพงศ์</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Sarabun','TH Sarabun New',sans-serif;background:#f0f4f8;color:#1a202c;font-size:15px;min-height:100vh}
:root{--blue:#2b6cb0;--blue-dark:#1a4a7a;--red:#e53e3e;--red-bg:#fff5f5;--red-border:#fc8181;--yellow:#d69e2e;--yel-bg:#fffff0;--yel-border:#ecc94b;--green:#276749;--green-bg:#f0fff4;--radius:10px}
.top{background:var(--blue);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center}
.top-left h1{font-size:17px;font-weight:bold}
.top-left p{font-size:11px;opacity:.8;margin-top:1px}
.count-pill{background:rgba(255,255,255,.2);padding:5px 12px;border-radius:20px;font-size:13px;font-weight:bold;text-align:center}
.count-pill span{display:block;font-size:10px;opacity:.8;font-weight:normal}
.ctrl-bar{background:#fff;padding:10px 14px;border-bottom:1px solid #e2e8f0;display:flex;flex-wrap:wrap;gap:8px}
.ctrl-row{display:flex;gap:8px;width:100%;flex-wrap:wrap}
select,input{padding:8px 10px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;font-family:inherit;background:#fff;flex:1;min-width:0;outline:none}
select:focus,input:focus{border-color:var(--blue)}
.legend-bar{display:flex;gap:14px;padding:8px 14px;background:#f7f9fc;border-bottom:1px solid #e2e8f0;font-size:12px;color:#4a5568}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;vertical-align:middle;margin-right:3px}
.dot.a{background:#fc8181}.dot.l{background:#f6e05e;border:1px solid #ecc94b}.dot.p{background:#9ae6b4;border:1px solid #48bb78}
.grid-wrap{padding:10px 12px;padding-bottom:90px}
.section-label{font-size:11px;font-weight:bold;color:#718096;text-transform:uppercase;letter-spacing:.5px;margin:8px 0 6px;padding-left:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:7px}
@media(min-width:500px){.grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}}
@media(min-width:768px){.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px}}
.card{border:1.5px solid #e2e8f0;border-radius:var(--radius);padding:8px 6px;cursor:pointer;background:#fff;text-align:center;transition:transform .08s,box-shadow .08s;-webkit-user-select:none;user-select:none;min-height:64px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.card:active{transform:scale(.94)}
.card.absent{background:var(--red-bg);border-color:var(--red-border)}
.card.late{background:var(--yel-bg);border-color:var(--yel-border)}
.card .no{font-size:10px;color:#a0aec0}
.card.absent .no{color:#fc8181}.card.late .no{color:#d69e2e}
.card .name{font-size:11.5px;font-weight:bold;line-height:1.3;color:#2d3748}
.card.absent .name{color:#c53030}.card.late .name{color:#975a16}
.card .badge{font-size:10px;height:13px;color:#a0aec0}
.card.absent .badge{color:var(--red-border)}.card.late .badge{color:var(--yel-border)}
.footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1.5px solid #e2e8f0;padding:10px 14px;display:flex;gap:8px;align-items:center;z-index:10}
.chips{flex:1;display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.chip{padding:3px 10px;border-radius:16px;font-size:12px;font-weight:bold;white-space:nowrap}
.chip.a{background:var(--red-bg);color:var(--red)}.chip.l{background:var(--yel-bg);color:var(--yellow)}.chip.p{background:var(--green-bg);color:var(--green)}
.btn-ok{background:var(--blue);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:bold;font-family:inherit;white-space:nowrap;flex-shrink:0}
.btn-ok:active{background:var(--blue-dark)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:#fff;border-radius:16px 16px 0 0;padding:20px 18px 30px;width:100%;max-width:600px;max-height:80vh;overflow-y:auto}
.sheet h2{font-size:16px;font-weight:bold;margin-bottom:12px;color:var(--blue)}
.result-box{background:#f7f9fc;border:1px solid #e2e8f0;border-radius:8px;padding:12px;font-size:13.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;color:#1a202c;font-family:'Sarabun',sans-serif}
.all-ok{background:var(--green-bg);border-color:#9ae6b4;text-align:center;padding:14px;font-weight:bold;color:var(--green);font-size:14px}
.sheet-btns{display:flex;gap:8px;margin-top:14px}
.btn-copy{background:#48bb78;color:#fff;border:none;padding:10px 0;border-radius:8px;cursor:pointer;font-size:14px;font-weight:bold;font-family:inherit;flex:1}
.btn-copy:active{background:#38a169}
.btn-close{background:#e2e8f0;color:#4a5568;border:none;padding:10px 16px;border-radius:8px;cursor:pointer;font-size:14px;font-family:inherit}
.btn-clear{background:none;border:none;color:#a0aec0;font-size:12px;cursor:pointer;padding:4px 8px;font-family:inherit;text-decoration:underline}
.saving{background:#718096 !important;pointer-events:none}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:24px;font-size:14px;font-weight:bold;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.ok{background:#276749;color:#fff}
.toast.err{background:#c53030;color:#fff}
.toast.show{opacity:1}
.fallback-link{font-size:11px;color:#a0aec0;text-align:center;margin-top:8px;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<div class="top">
  <div class="top-left">
    <h1>เช็คชื่อนักเรียน</h1>
    <p>วังกระแสวิทยาคม · อ.อนุพงศ์</p>
  </div>
  <div class="count-pill" id="top-count">0<span>ขาด/สาย</span></div>
</div>

<div class="ctrl-bar">
  <div class="ctrl-row">
    <select id="sel-class" onchange="changeClass()">
      <option value="M1_1">ม.1/1 (21 คน)</option>
      <option value="M2_1">ม.2/1 (28 คน)</option>
      <option value="M4_1" selected>ม.4/1 (47 คน)</option>
      <option value="M5_1">ม.5/1 (31 คน)</option>
      <option value="M6_1">ม.6/1 (35 คน)</option>
    </select>
    <select id="sel-course"></select>
  </div>
  <div class="ctrl-row">
    <input type="date" id="inp-date">
    <input type="number" id="inp-period" min="1" max="8" value="1" placeholder="คาบ" style="max-width:80px">
    <input type="text" id="inp-topic" placeholder="หัวข้อ (ไม่บังคับ)">
  </div>
</div>

<div class="legend-bar">
  <span><span class="dot p"></span>ปกติ</span>
  <span><span class="dot a"></span>ขาด (แตะ 1×)</span>
  <span><span class="dot l"></span>สาย (แตะ 2×)</span>
  <span style="color:#cbd5e0">ปกติ (แตะ 3×)</span>
</div>

<div class="grid-wrap">
  <div id="grid-male"></div>
  <div id="grid-female"></div>
</div>

<div class="footer">
  <div class="chips" id="chips"></div>
  <button class="btn-clear" onclick="clearAll()">ล้าง</button>
  <button class="btn-ok" id="btn-save" onclick="saveData()">บันทึก ✓</button>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="overlay" onclick="closeOverlay(event)">
  <div class="sheet" onclick="event.stopPropagation()">
    <h2>บันทึกไม่สำเร็จ — คัดลอกแทน</h2>
    <div class="result-box" id="result-box"></div>
    <div class="sheet-btns">
      <button class="btn-copy" id="btn-copy" onclick="doCopy()">📋 คัดลอก</button>
      <button class="btn-close" onclick="closeOverlay()">ปิด</button>
    </div>
    <p style="font-size:11px;color:#a0aec0;margin-top:10px;text-align:center">คัดลอกแล้วส่งใน Claude เพื่อบันทึกลงระบบ</p>
  </div>
</div>

let st={},cls='M4_1';

function getToday(){return new Date().toISOString().split('T')[0];}
function thDate(iso){const d=new Date(iso+'T00:00:00');const m=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];return `${d.getDate()} ${m[d.getMonth()]} ${d.getFullYear()+543}`;}

function changeClass(){cls=document.getElementById('sel-class').value;st={};buildCourses();buildGrid();updateChips();}

function buildCourses(){
  const c=D[cls].cr,s=document.getElementById('sel-course');
  s.innerHTML=c.map(x=>`<option value="${x.id}">${x.id} ${x.n}</option>`).join('');
}

function buildGrid(){
  const all=D[cls].s;
  const males=all.filter(s=>s.g==='ช');
  const females=all.filter(s=>s.g==='ญ');
  function cards(arr){return arr.map(s=>{
    const v=st[s.id]||'';
    return `<div class="card ${v}" onclick="tap('${s.id}')" id="c${s.id}"><div class="no">เลขที่ ${s.no}</div><div class="name">${s.n}</div><div class="badge">${v==='absent'?'ขาด':v==='late'?'สาย':''}</div></div>`;
  }).join('');}
  document.getElementById('grid-male').innerHTML=males.length?`<div class="section-label">ชาย (${males.length} คน)</div><div class="grid">${cards(males)}</div>`:'';
  document.getElementById('grid-female').innerHTML=females.length?`<div class="section-label" style="margin-top:10px">หญิง (${females.length} คน)</div><div class="grid">${cards(females)}</div>`:'';
}

function tap(id){
  const cur=st[id]||'';
  st[id]=cur===''?'absent':cur==='absent'?'late':'';
  const card=document.getElementById('c'+id);
  card.className='card'+(st[id]?' '+st[id]:'');
  card.querySelector('.badge').textContent=st[id]==='absent'?'ขาด':st[id]==='late'?'สาย':'';
  updateChips();
}

function updateChips(){
  const total=D[cls].s.length;
  const absent=Object.values(st).filter(v=>v==='absent').length;
  const late=Object.values(st).filter(v=>v==='late').length;
  const present=total-absent-late;
  document.getElementById('top-count').innerHTML=`${absent+late}<span>ขาด/สาย</span>`;
  document.getElementById('chips').innerHTML=`
    <span class="chip p">มา ${present}</span>
    ${absent?`<span class="chip a">ขาด ${absent}</span>`:''}
    ${late?`<span class="chip l">สาย ${late}</span>`:''}
  `;
}

function clearAll(){st={};buildGrid();updateChips();}

function buildPayload(){
  const cd=D[cls];
  const date=document.getElementById('inp-date').value||getToday();
  const course=document.getElementById('sel-course').value;
  const period=document.getElementById('inp-period').value||'?';
  const topic=document.getElementById('inp-topic').value;
  const absent=cd.s.filter(s=>st[s.id]==='absent');
  const late=cd.s.filter(s=>st[s.id]==='late');
  return {
    date:thDate(date), cls:cd.c, course, period, topic,
    records:[
      ...absent.map(s=>({no:s.no,name:s.n,id:s.id,status:'absent'})),
      ...late.map(s=>({no:s.no,name:s.n,id:s.id,status:'late'}))
    ]
  };
}

function showToast(msg,type,dur=2500){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className=`toast ${type} show`;
  setTimeout(()=>t.className='toast',dur);
}

function saveData(){
  if(SCRIPT_URL==='YOUR_APPS_SCRIPT_URL_HERE'){
    showFallback(); return;
  }
  const btn=document.getElementById('btn-save');
  btn.textContent='กำลังบันทึก...';btn.className='btn-ok saving';
  const payload=buildPayload();
  const form=new URLSearchParams();
  form.append('data',JSON.stringify(payload));
  fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:form})
    .then(()=>{
      btn.textContent='บันทึก ✓';btn.className='btn-ok';
      const n=payload.records.length;
      showToast(n===0?'✓ มาครบ — บันทึกแล้ว':`✓ บันทึกแล้ว (ขาด/สาย ${n} คน)`,'ok');
      setTimeout(()=>clearAll(),1200);
    })
    .catch(()=>{
      btn.textContent='บันทึก ✓';btn.className='btn-ok';
      showToast('เชื่อมต่อไม่ได้ — ใช้ copy แทน','err',3500);
      showFallback();
    });
}

function showFallback(){
  const payload=buildPayload();
  const cd=D[cls];
  const absent=payload.records.filter(r=>r.status==='absent');
  const late=payload.records.filter(r=>r.status==='late');
  const present=cd.s.length-absent.length-late.length;
  let txt=`เช็คชื่อ ${payload.cls} ${payload.course} วันที่ ${payload.date} คาบ ${payload.period}`;
  if(payload.topic) txt+=` หัวข้อ: ${payload.topic}`;
  txt+=`\nนักเรียนทั้งหมด: ${cd.s.length} คน  มา: ${present} คน`;
  if(!absent.length&&!late.length) txt+='\nมาเรียนครบทุกคน ✓';
  else{
    if(absent.length) txt+='\nขาด: '+absent.map(r=>`${r.no}) ${r.name}`).join(', ');
    if(late.length) txt+='\nสาย: '+late.map(r=>`${r.no}) ${r.name}`).join(', ');
  }
  document.getElementById('result-box').textContent=txt;
  document.getElementById('btn-copy').textContent='📋 คัดลอก';
  document.getElementById('overlay').classList.add('show');
}

function doCopy(){
  const txt=document.getElementById('result-box').textContent;
  navigator.clipboard.writeText(txt).then(()=>{
    const b=document.getElementById('btn-copy');
    b.textContent='✓ คัดลอกแล้ว!';b.style.background='#276749';
    setTimeout(()=>{b.textContent='📋 คัดลอก';b.style.background='';},2000);
  }).catch(()=>{document.getElementById('result-box').select&&document.getElementById('result-box').select();});
}

function closeOverlay(e){
  if(!e||e.target===document.getElementById('overlay'))
    document.getElementById('overlay').classList.remove('show');
}

document.getElementById('inp-date').value=getToday();
buildCourses();
buildGrid();
updateChips();
</script>
