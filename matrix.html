<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 เรียนรู้ เมทริกซ์ — ม.5/1</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&display=swap');
:root {
  --bg:#080e1a; --sf:#0f1923; --sf2:#172030; --bd:#1e2d3d;
  --tx:#dce8f5; --mu:#6b8aaa; --ac:#4fa3e3; --go:#f0c000;
  --gr:#3fb950; --rd:#f85149;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;flex-direction:column;}

/* Header */
#hdr{background:linear-gradient(135deg,#0a1628,#080e1a);border-bottom:1px solid var(--bd);padding:10px 20px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;}
#hdr h1{font-size:16px;font-weight:800;} #hdr h1 span{color:var(--go);}
#hdr a{color:var(--mu);font-size:13px;text-decoration:none;margin-right:auto;}
#hdr a:hover{color:var(--tx);}

/* Layout */
#wrap{display:flex;flex:1;overflow:hidden;height:calc(100vh - 48px);}

/* Sidebar */
#side{width:200px;flex-shrink:0;background:var(--sf);border-right:1px solid var(--bd);overflow-y:auto;padding:12px 8px;}
.s-btn{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;border:none;border-radius:8px;background:transparent;color:var(--mu);font-family:inherit;font-size:13px;cursor:pointer;text-align:left;transition:all .15s;margin-bottom:3px;}
.s-btn:hover{background:rgba(255,255,255,.06);color:var(--tx);}
.s-btn.active{background:rgba(79,163,227,.15);color:var(--tx);font-weight:700;}
.s-emoji{font-size:16px;flex-shrink:0;}

/* Main */
#main{flex:1;overflow-y:auto;display:flex;flex-direction:column;}

/* Tabs */
#tabs{display:flex;gap:0;border-bottom:1px solid var(--bd);background:var(--sf);flex-shrink:0;}
.tab{padding:11px 24px;border:none;background:transparent;color:var(--mu);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;}
.tab.active{color:var(--tx);border-bottom-color:var(--ac);}
.tab:hover{color:var(--tx);}

/* Content */
#content{padding:28px;max-width:800px;width:100%;}

/* 6-color scheme for matrix multiplication (Step 4) */
.c1{color:#f85149;font-weight:700}
.c2{color:#f0a050;font-weight:700}
.c3{color:#f0c000;font-weight:700}
.c4{color:#3fb950;font-weight:700}
.c5{color:#4fa3e3;font-weight:700}
.c6{color:#d2a8ff;font-weight:700}

/* Theory styles */
.th-section{margin-bottom:24px;}
.th-label{font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--mu);text-transform:uppercase;margin-bottom:10px;}
.th-card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:16px 18px;margin-bottom:10px;font-size:14px;line-height:1.8;}
.th-card h4{font-size:13px;font-weight:800;color:var(--ac);margin-bottom:8px;}
.th-card table{border-collapse:collapse;width:100%;margin-top:8px;}
.th-card td,.th-card th{padding:5px 10px;border:1px solid var(--bd);font-size:13px;}
.th-card th{background:rgba(255,255,255,.05);font-weight:700;}
.example-box{background:rgba(79,163,227,.06);border:1px solid rgba(79,163,227,.25);border-radius:8px;padding:14px 16px;margin:8px 0;font-size:14px;}
.example-box strong{color:var(--ac);}
.formula{background:rgba(255,255,255,.04);border-left:3px solid var(--go);padding:10px 14px;border-radius:0 8px 8px 0;font-size:15px;margin:8px 0;line-height:2;}

/* Matrix display */
.mat-wrap{display:inline-flex;align-items:stretch;vertical-align:middle;margin:2px 4px;}
.mat-bracket{display:flex;flex-direction:column;justify-content:stretch;}
.mat-bracket.left{border-left:2.5px solid var(--tx);border-top:1.5px solid var(--tx);border-bottom:1.5px solid var(--tx);padding:2px 0 2px 6px;border-radius:3px 0 0 3px;}
.mat-bracket.right{border-right:2.5px solid var(--tx);border-top:1.5px solid var(--tx);border-bottom:1.5px solid var(--tx);padding:2px 6px 2px 0;border-radius:0 3px 3px 0;}
.mat-inner{display:flex;flex-direction:column;gap:4px;padding:2px 6px;}
.mat-row{display:flex;gap:12px;}
.mat-cell{min-width:22px;text-align:right;font-size:14px;font-family:'Courier New',monospace;}
.mat-cell.hi{color:var(--go);font-weight:700;}

/* Quiz styles */
.q-item{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:16px 18px;margin-bottom:14px;}
.q-num{font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--mu);text-transform:uppercase;margin-bottom:8px;}
.q-stem{font-size:14px;line-height:1.7;margin-bottom:12px;}
.choices{display:flex;flex-direction:column;gap:7px;}
.choice{display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:7px;border:1px solid var(--bd);cursor:pointer;font-size:13px;transition:all .15s;background:transparent;}
.choice:hover:not(.disabled){background:rgba(255,255,255,.05);border-color:var(--ac);}
.choice.selected:not(.disabled){background:rgba(79,163,227,.12);border-color:var(--ac);}
.choice.correct{background:rgba(63,185,80,.15);border-color:var(--gr);}
.choice.wrong{background:rgba(248,81,73,.1);border-color:var(--rd);}
.choice-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--bd);flex-shrink:0;transition:all .15s;}
.choice.selected .choice-dot{background:var(--ac);border-color:var(--ac);}
.choice.correct .choice-dot{background:var(--gr);border-color:var(--gr);}
.choice.wrong .choice-dot{background:var(--rd);border-color:var(--rd);}
.choice.disabled{cursor:default;}
.num-input{width:120px;background:var(--sf2);border:1px solid var(--bd);border-radius:7px;color:var(--tx);padding:8px 12px;font-family:inherit;font-size:15px;outline:none;margin-right:4px;}
.num-input:focus{border-color:var(--ac);}
.num-input.correct{border-color:var(--gr);background:rgba(63,185,80,.08);}
.num-input.wrong{border-color:var(--rd);background:rgba(248,81,73,.06);}
.sign-btn{background:var(--sf2);border:1px solid var(--bd);border-radius:7px;color:var(--tx);padding:7px 11px;font-size:16px;cursor:pointer;line-height:1;margin-right:4px;}
.sign-btn:hover:not(:disabled){border-color:var(--ac);color:var(--ac);}
.sign-btn:disabled{opacity:0.4;cursor:default;}
.q-explain{font-size:12px;color:var(--mu);margin-top:10px;padding:8px 12px;background:rgba(255,255,255,.03);border-radius:6px;display:none;line-height:1.6;}
.q-explain.show{display:block;}
.q-feedback{font-size:12px;font-weight:700;margin-top:6px;}
.q-feedback.ok{color:var(--gr);}
.q-feedback.ng{color:var(--rd);}

/* Result panel */
#result{display:none;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:24px;text-align:center;margin-bottom:20px;}
#result .score{font-size:48px;font-weight:800;color:var(--go);}
#result .verdict{font-size:16px;margin:8px 0 16px;font-weight:700;}
.result-pass{color:var(--gr);}
.result-fail{color:var(--rd);}
.ready-box{background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.4);border-radius:8px;padding:12px 16px;font-size:14px;margin-top:12px;}

/* Buttons */
.btn{padding:10px 20px;border:none;border-radius:8px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s;}
.btn-ac{background:var(--ac);color:#001a30;}
.btn-ac:hover{opacity:.85;}
.btn-go{background:var(--go);color:#1a1000;}
.btn-go:hover{background:#ffd740;}
.btn-gr{background:var(--gr);color:#001a00;}
.btn-gh{background:rgba(255,255,255,.08);color:var(--tx);border:1px solid var(--bd);}
.btn-gh:hover{background:rgba(255,255,255,.14);}

@media(max-width:700px){#side{display:none;}#content{padding:16px;}}
</style>
</head>
<body>

<div id="hdr">
  <a href="mastery_m5.html">← Mastery Path</a>
  <h1>📚 เรียนรู้ <span>เมทริกซ์</span> · ม.5/1</h1>
</div>

<div id="wrap">
  <div id="side" id="sidebar"></div>
  <div id="main">
    <div id="tabs">
      <button class="tab active" onclick="showTab('learn')">📖 ใบความรู้</button>
      <button class="tab" onclick="showTab('quiz')">✏️ แบบทดสอบ</button>
    </div>
    <div id="content"></div>
  </div>
</div>

<script>
// ── Helpers ──────────────────────────────────────────
const ri  = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const rne = (a,b,n) => { let v; do{v=ri(a,b)}while(v===n); return v; };
const sh  = a => [...a].sort(()=>Math.random()-.5);
const rnd = (v,d=2) => Math.round(v*10**d)/10**d;

function matH(rows, hiR=-1, hiC=-1) {
  const inner = rows.map((r,ri2)=>`<div class="mat-row">${r.map((c,ci)=>`<span class="mat-cell${(ri2===hiR&&ci===hiC)?' hi':''}">${c}</span>`).join('')}</div>`).join('');
  return `<span class="mat-wrap"><span class="mat-bracket left"></span><span class="mat-inner">${inner}</span><span class="mat-bracket right"></span></span>`;
}

// ── Step metadata ─────────────────────────────────────
const SM = [
  {id:1,emoji:'🌱',title:'นิยามและประเภท',color:'#2e7d32'},
  {id:2,emoji:'➕',title:'การบวก-ลบเมทริกซ์',color:'#1565c0'},
  {id:2.5,emoji:'🔢',title:'ทบทวนจำนวนเต็ม',color:'#e65100',side:true,unlockAt:2},
  {id:3,emoji:'✖️',title:'คูณด้วยสเกลาร์',color:'#6a1b9a'},
  {id:4,emoji:'⚡',title:'การคูณเมทริกซ์',color:'#bf360c'},
  {id:5,emoji:'🔍',title:'ดีเทอร์มิแนนต์',color:'#b71c1c'},
  {id:6,emoji:'📐',title:'สมบัติ det',color:'#e65100'},
  {id:7,emoji:'🔄',title:'A⁻¹ ของ 2×2',color:'#880e4f'},
  {id:8,emoji:'🧮',title:'A⁻¹ ของ 3×3',color:'#4a148c'},
  {id:9,emoji:'🏆',title:'แก้ระบบสมการ',color:'#004d40'},
];

// ── Content (theory + quiz generators) ───────────────
const C = {};

// ── Step 1 ────────────────────────────────────────────
C[1] = {
theory: `
<div class="th-section">
  <div class="th-label">นิยาม</div>
  <div class="th-card">
    <h4>เมทริกซ์ขนาด m×n</h4>
    ตารางตัวเลขที่มี <b>m แถว</b> (row) และ <b>n หลัก</b> (column)<br>
    สมาชิกตำแหน่งแถวที่ i หลักที่ j เขียนแทนด้วย <b>aᵢⱼ</b>
    <div class="example-box">
      <strong>ตัวอย่าง:</strong> A ขนาด 2×3<br><br>
      ${matH([[1,2,3],[4,5,6]])}<br><br>
      a₁₂ &nbsp;→&nbsp; <b>แถวที่ 1, หลักที่ 2</b> &nbsp;→&nbsp; ค่า = <b>2</b><br>
      a₂₃ &nbsp;→&nbsp; <b>แถวที่ 2, หลักที่ 3</b> &nbsp;→&nbsp; ค่า = <b>6</b>
    </div>
  </div>
</div>
<div class="th-section">
  <div class="th-label">ประเภทเมทริกซ์</div>
  <div class="th-card">
    <table>
      <tr><th>ประเภท</th><th>เงื่อนไข</th><th>ตัวอย่าง</th></tr>
      <tr><td>จตุรัส (Square)</td><td>m = n</td><td>${matH([[1,2],[3,4]])}</td></tr>
      <tr><td>เอกลักษณ์ (I)</td><td>แนวทแยง=1, อื่น=0</td><td>${matH([[1,0],[0,1]])}</td></tr>
      <tr><td>ศูนย์ (Zero)</td><td>ทุกสมาชิก = 0</td><td>${matH([[0,0],[0,0]])}</td></tr>
      <tr><td>แถว (Row)</td><td>m = 1</td><td>${matH([[2,5,3]])}</td></tr>
      <tr><td>หลัก (Column)</td><td>n = 1</td><td>${matH([[2],[5]])}</td></tr>
    </table>
  </div>
</div>
<div class="th-section">
  <div class="th-label">เมทริกซ์ทรานสโพส</div>
  <div class="th-card">
    <h4>Aᵀ — สลับแถวกับหลัก</h4>
    ถ้า A ขนาด m×n แล้ว Aᵀ ขนาด <b>n×m</b>
    <div class="example-box">
      <strong>ตัวอย่าง:</strong><br><br>
      A = ${matH([[1,2,3],[4,5,6]])} &nbsp; Aᵀ = ${matH([[1,4],[2,5],[3,6]])}<br><br>
      แถวที่ 1 ของ A [1, 2, 3] กลายเป็น <b>หลักที่ 1</b> ของ Aᵀ<br>
      แถวที่ 2 ของ A [4, 5, 6] กลายเป็น <b>หลักที่ 2</b> ของ Aᵀ
    </div>
  </div>
</div>`,

makeQ() {
  const Q = [];

  // Q1: ขนาดเมทริกซ์
  const m1=ri(2,4), n1=rne(2,4,m1); // บังคับ m≠n เพื่อกัน n×m ซ้ำกับ m×n
  const A1 = Array.from({length:m1},()=>Array.from({length:n1},()=>ri(-5,9)));
  const correct1=`${m1}×${n1}`;
  const pool1=[`${n1}×${m1}`,`${m1}×${n1+1}`,`${m1-1}×${n1}`,`${m1+1}×${n1}`,`${m1}×${n1-1}`].filter(s=>s!==correct1);
  const w1=sh(pool1).slice(0,3).map(s=>[s,false]);
  const c1 = sh([[correct1,true],...w1]);
  Q.push({type:'mc',stem:`เมทริกซ์ A นี้มีขนาดเท่าไหร่?<br><br>${matH(A1)}`,
    choices:c1.map(x=>x[0]),answer:c1.findIndex(x=>x[1]),
    explain:`เมทริกซ์มี ${m1} แถว ${n1} หลัก → ขนาด ${m1}×${n1}`});

  // Q2: หา aᵢⱼ
  const A2 = Array.from({length:3},()=>Array.from({length:3},()=>ri(-5,9)));
  const i2=ri(0,2), j2=ri(0,2);
  const ans2=A2[i2][j2];
  const w2=new Set([ans2]);
  const wrong2=[];
  while(wrong2.length<3){const v=ri(-5,9);if(!w2.has(v)){w2.add(v);wrong2.push(v);}}
  const c2=sh([[ans2,true],...wrong2.map(v=>[v,false])]);
  Q.push({type:'mc',stem:`จากเมทริกซ์ A ต่อไปนี้ a<sub>${i2+1}${j2+1}</sub> มีค่าเท่าไหร่?<br><br>${matH(A2)}`,
    choices:c2.map(x=>`${x[0]}`),answer:c2.findIndex(x=>x[1]),
    explain:`a<sub>${i2+1}${j2+1}</sub> = สมาชิกแถวที่ ${i2+1} หลักที่ ${j2+1} = ${ans2}`});

  // Q3: ประเภท
  const types=[
    {mat:[[ri(1,4),ri(1,4)],[ri(1,4),ri(1,4)]],ans:'เมทริกซ์จตุรัส (2×2)',w:['เมทริกซ์เอกลักษณ์','เมทริกซ์แถว','เมทริกซ์ศูนย์']},
    {mat:[[1,0,0],[0,1,0],[0,0,1]],ans:'เมทริกซ์เอกลักษณ์ I₃',w:['เมทริกซ์จตุรัสทั่วไป','เมทริกซ์ศูนย์','เมทริกซ์แถว']},
    {mat:[[ri(1,5),ri(1,5),ri(1,5)]],ans:'เมทริกซ์แถว (1×3)',w:['เมทริกซ์จตุรัส','เมทริกซ์หลัก','เมทริกซ์เอกลักษณ์']},
  ];
  const t3=types[ri(0,types.length-1)];
  const c3=sh([[t3.ans,true],...t3.w.map(v=>[v,false])]);
  Q.push({type:'mc',stem:`เมทริกซ์ต่อไปนี้เป็นประเภทใด?<br><br>${matH(t3.mat)}`,
    choices:c3.map(x=>x[0]),answer:c3.findIndex(x=>x[1]),
    explain:t3.ans});

  // Q4: ทรานสโพสขนาด
  const m4=ri(2,3), n4=rne(2,3,m4);
  const c4=sh([[`${n4}×${m4}`,true],[`${m4}×${n4}`,false],[`${m4}×${m4}`,false],[`${n4}×${n4}`,false]]);
  Q.push({type:'mc',stem:`ถ้า A มีขนาด ${m4}×${n4} แล้ว Aᵀ มีขนาดเท่าไหร่?`,
    choices:c4.map(x=>x[0]),answer:c4.findIndex(x=>x[1]),
    explain:`ทรานสโพสสลับแถว↔หลัก → ${m4}×${n4} กลายเป็น ${n4}×${m4}`});

  // Q5: เมทริกซ์เอกลักษณ์
  const mats5=[[[1,0],[0,1]],[[1,1],[0,1]],[[2,0],[0,2]],[[0,1],[1,0]]];
  const shuf5=sh(mats5);
  const ans5=shuf5.findIndex(m=>m[0][0]===1&&m[0][1]===0&&m[1][0]===0&&m[1][1]===1);
  Q.push({type:'mc',stem:`ข้อใดคือเมทริกซ์เอกลักษณ์ขนาด 2×2 (I₂)?`,
    choices:shuf5.map(m=>matH(m)),answer:ans5,
    explain:'I₂ มีสมาชิกแนวทแยงหลักเท่ากับ 1 ทั้งหมด และสมาชิกอื่น = 0'});

  return Q;
}};

// ── Step 2 ────────────────────────────────────────────
C[2] = {
theory: `
<div class="th-section">
  <div class="th-label">เงื่อนไขและนิยาม</div>
  <div class="th-card">
    <h4>การบวก-ลบเมทริกซ์</h4>
    A ± B กระทำได้ก็ต่อเมื่อ <b>A และ B มีขนาดเท่ากัน</b> (m×n ทั้งคู่)<br>
    วิธีคำนวณ: บวก/ลบสมาชิก<b>ตำแหน่งเดียวกัน</b>
    <div class="formula">(A+B)ᵢⱼ = aᵢⱼ + bᵢⱼ</div>
    <div class="example-box">
      <strong>ตัวอย่าง:</strong><br><br>
      A = ${matH([[1,2],[3,4]])} &nbsp; B = ${matH([[5,6],[7,8]])}<br><br>
      <table style="border-collapse:collapse;margin:4px 0"><tr>
        <td style="padding-right:6px;vertical-align:middle;white-space:nowrap">A + B =</td>
        <td>${matH([['1+5','2+6'],['3+7','4+8']])}</td>
      </tr><tr>
        <td style="padding-right:6px;vertical-align:middle;white-space:nowrap">A + B =</td>
        <td>${matH([[6,8],[10,12]])}</td>
      </tr></table>
    </div>
  </div>
</div>
<div class="th-section">
  <div class="th-label">สมบัติ</div>
  <div class="th-card">
    <table>
      <tr><th>สมบัติ</th><th>สูตร</th></tr>
      <tr><td>สลับที่</td><td>A + B = B + A</td></tr>
      <tr><td>การเปลี่ยนหมู่</td><td>(A + B) + C = A + (B + C)</td></tr>
      <tr><td>เมทริกซ์ศูนย์</td><td>A + O = A</td></tr>
      <tr><td>เมทริกซ์ตรงข้าม</td><td>A + (−A) = O</td></tr>
    </table>
    <div style="margin-top:10px;color:var(--rd);font-size:13px;">⚠ A − B ≠ B − A (ลบ<b>ไม่</b>สลับที่)</div>
  </div>
</div>`,

makeQ() {
  const Q = [];
  // Q1 MC: เงื่อนไข
  const c1=sh([['A และ B มีขนาดเท่ากัน (m×n ทั้งคู่)',true],['A และ B เป็นเมทริกซ์จตุรัส',false],['จำนวนแถวของ A = จำนวนหลักของ B',false],['A และ B มีขนาดอะไรก็ได้',false]]);

  Q.push({type:'mc',stem:'adj(A) คืออะไร?',choices:c4.map(x=>x[0]),answer:c4.findIndex(x=>x[1]),explain:'adj(A) = ทรานสโพสของ cofactor matrix (เรียกว่า adjugate หรือ adjoint ของ A)'});

  // Q5 Num: det(A)
  Q.push({type:'num',stem:`จาก A เดิม = ${matH(A)}<br>det(A) = ? (ใช้ Sarrus)`,
    answer:det,tol:0,explain:`Sarrus: ${a}·${e}·${ii}+${b}·${f}·${g}+${c}·${d}·${h}−${c}·${e}·${g}−${a}·${f}·${h}−${b}·${d}·${ii} = ${det}`});

  return Q;
}};

// ── Step 9 ── แก้ระบบสมการ (เดิมขั้น 7) ─────────────────────
C[9] = {
theory: `
<div class="th-section">
  <div class="th-label">รูปแบบเมทริกซ์</div>
  <div class="th-card">
    <h4>เขียนระบบสมการในรูป AX = B</h4>
    ระบบ:&nbsp; ax + by = p &nbsp;,&nbsp; cx + dy = q<br><br>
    <div class="formula">
      ${matH([['a','b'],['c','d']])} &nbsp;
      ${matH([['x'],['y']])} &nbsp;=&nbsp;
      ${matH([['p'],['q']])}
      <br><br>A × X = B
    </div>
  </div>
</div>
<div class="th-section">
  <div class="th-label">วิธีแก้ (วิธี A⁻¹)</div>
  <div class="th-card">
    <div class="formula">X = A⁻¹ · B</div>
    <div class="example-box">
      <strong>ตัวอย่าง:</strong> 2x + y = 5 &nbsp;,&nbsp; 5x + 3y = 13<br><br>
      A = ${matH([[2,1],[5,3]])} &nbsp; B = ${matH([[5],[13]])}<br><br>
      det(A) = (2×3) − (1×5) = 6 − 5 = <b>1</b><br>
      &nbsp;→&nbsp; A⁻¹ = ¹⁄₁ × ${matH([[3,-1],[-5,2]])} = ${matH([[3,-1],[-5,2]])}<br><br>
      X = A⁻¹B = ${matH([[3,-1],[-5,2]])} × ${matH([[5],[13]])}<br><br>
      &nbsp;x: (3×5) + (−1×13) = 15 + (−13) = <b>2</b><br>
      &nbsp;y: (−5×5) + (2×13) = −25 + 26 = <b>1</b><br><br>
      ∴ X = ${matH([[2],[1]])} &nbsp; → &nbsp; x = 2, y = 1
    </div>
  </div>
</div>
<div class="th-section">
  <div class="th-label">กฎของโครเมอร์ (Cramer's Rule)</div>
  <div class="th-card">
    <h4>ระบบ: ax + by = p &nbsp;,&nbsp; cx + dy = q</h4>
    <div class="formula">
      D = det(A) = ad − bc<br><br>
      Dₓ = det${matH([['p','b'],['q','d']])} &nbsp;(แทนหลัก x ด้วย B)<br><br>
      Dᵧ = det${matH([['a','p'],['c','q']])} &nbsp;(แทนหลัก y ด้วย B)<br><br>
      x = Dₓ/D &nbsp;&nbsp;&nbsp; y = Dᵧ/D
    </div>
    <div class="example-box">
      <strong>ตัวอย่าง:</strong> 2x + y = 5 &nbsp;,&nbsp; 5x + 3y = 13<br><br>
      D = det${matH([[2,1],[5,3]])} = (2×3) − (1×5) = 6 − 5 = <b>1</b><br>
      Dₓ = det${matH([[5,1],[13,3]])} = (5×3) − (1×13) = 15 − 13 = <b>2</b><br>
      &nbsp;→&nbsp; x = Dₓ/D = 2/1 = <b>2</b><br>
      Dᵧ = det${matH([[2,5],[5,13]])} = (2×13) − (5×5) = 26 − 25 = <b>1</b><br>
      &nbsp;→&nbsp; y = Dᵧ/D = 1/1 = <b>1</b>
    </div>
  </div>
</div>`,

makeQ() {
  const Q = [];
  // Q1 MC: รูปแบบ AX=B
  const c1=sh([['AX = B โดย X = A⁻¹B',true],['AX = B โดย X = BA⁻¹',false],['XA = B โดย X = BA⁻¹',false],['AX = B โดย X = AB⁻¹',false]]);
  Q.push({type:'mc',stem:'ถ้าเขียนระบบสมการในรูป AX = B แล้ว X มีค่าเท่าไหร่?',choices:c1.map(x=>x[0]),answer:c1.findIndex(x=>x[1]),explain:'X = A⁻¹B (คูณทางซ้ายด้วย A⁻¹: A⁻¹AX = A⁻¹B → IX = A⁻¹B)'});

  // Q2 MC: Cramer's Rule — Dₓ
  let a2,b2,c2,d2,p2,q2,x2,y2,det2;
  do{a2=ri(1,4);b2=ri(1,3);c2=ri(1,4);d2=ri(1,3);det2=a2*d2-b2*c2;x2=ri(-4,4);y2=ri(-4,4);}
  while(det2===0||x2===0||y2===0);
  p2=a2*x2+b2*y2; q2=c2*x2+d2*y2;
  const Dx2=p2*d2-b2*q2;
  const mDx=[[[p2,b2],[q2,d2]],[[a2,p2],[c2,q2]],[[p2,b2],[c2,d2]],[[a2,b2],[q2,d2]]];
  const sDx=sh(mDx);
  const di=sDx.findIndex(m=>m[0][0]===p2&&m[0][1]===b2&&m[1][0]===q2&&m[1][1]===d2);
  Q.push({type:'mc',stem:`ระบบ ${a2}x+${b2}y=${p2} , ${c2}x+${d2}y=${q2}<br>ใน Cramer's Rule &nbsp; Dₓ = det(?) = ?`,
    choices:sDx.map(m=>matH(m)),answer:di,
    explain:`Dₓ = det (แทนหลัก x ด้วย B) = det${matH([[p2,b2],[q2,d2]])} = ${p2}·${d2}−${b2}·${q2} = ${Dx2}`});

  // Q3 Num: หา Dₓ
  let a3,b3,c3,d3,p3,q3,x3,y3,det3;
  do{a3=ri(1,4);b3=ri(1,3);c3=ri(1,4);d3=ri(1,3);det3=a3*d3-b3*c3;x3=ri(-4,4);y3=ri(-4,4);}
  while(det3===0||x3===0||y3===0);
  p3=a3*x3+b3*y3; q3=c3*x3+d3*y3;
  const Dx3=p3*d3-b3*q3;
  Q.push({type:'num',stem:`ระบบ ${a3}x+${b3}y=${p3} , ${c3}x+${d3}y=${q3}<br>จงหา Dₓ = det${matH([[p3,b3],[q3,d3]])}`,
    answer:Dx3,tol:0,explain:`Dₓ = ${p3}·${d3}−${b3}·${q3} = ${p3*d3}−${b3*q3} = ${Dx3}`});

  // Q4 Num: แก้ด้วย A⁻¹
  let a4,b4,c4,d4,x4,y4,det4;
  do{x4=ri(-5,5);y4=ri(-5,5);a4=ri(1,4);b4=ri(1,3);c4=ri(1,4);d4=ri(1,3);det4=a4*d4-b4*c4;}
  while(det4===0||x4===0||y4===0);
  const p4=a4*x4+b4*y4, q4=c4*x4+d4*y4;
  Q.push({type:'num',stem:`แก้ด้วยวิธี A⁻¹: ${a4}x+${b4}y=${p4} , ${c4}x+${d4}y=${q4}<br>หาค่า x`,
    answer:x4,tol:0.01,explain:`det(A)=${det4} &nbsp; X=A⁻¹B → x=${x4}, y=${y4}`});

  // Q5 Num: แก้ด้วย Cramer
  let a5,b5,c5,d5,x5,y5,det5;
  do{x5=ri(-5,5);y5=ri(-5,5);a5=ri(1,4);b5=ri(1,3);c5=ri(1,4);d5=ri(1,3);det5=a5*d5-b5*c5;}
  while(det5===0||x5===0||y5===0);
  const p5=a5*x5+b5*y5, q5=c5*x5+d5*y5;
  const Dy5=a5*q5-c5*p5;
  Q.push({type:'num',stem:`แก้ด้วย Cramer's Rule: ${a5}x+${b5}y=${p5} , ${c5}x+${d5}y=${q5}<br>หาค่า y = Dᵧ/D`,
    answer:y5,tol:0.01,explain:`D=${det5} &nbsp; Dᵧ=det${matH([[a5,p5],[c5,q5]])}=${a5*q5}−${c5*p5}=${Dy5} &nbsp;→&nbsp; y=${Dy5}/${det5}=${y5}`});

  return Q;
}};

// ── Google Sheets Horizon Sync ────────────────────────
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTkRLvKkv25XcnLr1kUppjvhyb6K08wXQHYlLxGKScovRbPlTPfgeyjUY1W0m9M2Wl79YkRu3B0QOFt/pub?gid=0&single=true&output=csv';
let horizon = 9;

async function fetchHorizon() {
  try {
    const ctrl = new AbortController();
    const tid  = setTimeout(() => ctrl.abort(), 10000);
    const res  = await fetch(CSV_URL, { signal: ctrl.signal });
    clearTimeout(tid);
    if (!res.ok) return;
    const text = (await res.text()).replace(/^﻿/, '');
    const rows = text.trim().split('\n').map(r => r.split(',').map(c => c.trim().replace(/^"|"$/g,'')));
    const hdr  = rows[0].map(h => h.toLowerCase());
    const iNo  = hdr.indexOf('no');
    const iSt  = hdr.indexOf('step');
    if (iNo < 0 || iSt < 0) return;
    const cfg  = rows.slice(1).find(r => parseInt(r[iNo]) === 0);
    if (cfg) {
      const h = parseInt(cfg[iSt]);
      if (!isNaN(h) && h !== horizon) {
        horizon = Math.min(9, Math.max(1, h));
        buildSidebar();
        // ถ้าขั้นปัจจุบันถูก lock → กลับไปขั้นสูงสุดที่เปิด
        const curSM=SM.find(s=>s.id===curStep);
        const curLockAt=(curSM&&curSM.unlockAt!==undefined)?curSM.unlockAt:curStep;
        if (curLockAt > horizon) { curStep = horizon; quiz = null; userAns = {}; submitted = false; renderContent(); }
      }
    }
  } catch(e) { /* silent — no internet */ }
}

// ── State ─────────────────────────────────────────────
let curStep=1, curTab='learn', quiz=null, userAns={}, submitted=false;

// ── Sidebar ───────────────────────────────────────────
function buildSidebar(){
  const el=document.getElementById('side');
  el.innerHTML=SM.map(s=>{
    const lockAt = s.unlockAt !== undefined ? s.unlockAt : s.id;
    const locked = lockAt > horizon;
    const isCur = s.id===curStep && !locked;
    const sideStyle = s.side
      ? `margin-left:14px;border-left:2px solid ${locked?'#555':'#e65100'};padding-left:8px;`
      : '';
    return `<button class="s-btn${isCur?' active':''}"
      onclick="${locked?'':'showStep('+s.id+')'}"
      style="${locked?'opacity:0.32;cursor:not-allowed;':''}${sideStyle}"
      ${locked?'disabled':''}>
      <span class="s-emoji">${locked?'🔒':s.emoji}</span>
      <span>ขั้น ${s.id}${s.side?' <span style="font-size:9px;background:#e65100;color:#fff;border-radius:3px;padding:0 3px">ทบทวน</span>':''}<br>
        <small style="font-weight:400;font-size:11px">${locked?'ล็อคอยู่':s.title}</small></span>
    </button>`;
  }).join('');
}

// ── Show Step ─────────────────────────────────────────
function showStep(id){
  const sm=SM.find(s=>s.id===id);
  const lockAt=(sm&&sm.unlockAt!==undefined)?sm.unlockAt:id;
  if(lockAt > horizon) return; // ล็อคอยู่
  curStep=id; curTab='learn'; quiz=null; userAns={}; submitted=false;
  buildSidebar();
  document.querySelectorAll('.tab').forEach((t,i)=>{t.classList.toggle('active',i===0);});
  renderContent();
}

function showTab(tab){
  curTab=tab;
  if(tab==='quiz'&&!quiz){
    try{ quiz=C[curStep].makeQ(); userAns={}; submitted=false; }
    catch(e){ console.error('[quiz] makeQ failed step',curStep,e); quiz=null; }
  }
  document.querySelectorAll('.tab').forEach(t=>{t.classList.toggle('active',t.textContent.includes(tab==='learn'?'ใบความรู้':'แบบทดสอบ'));});
  renderContent();
}

// ── Render ────────────────────────────────────────────
function renderContent(){
  const el=document.getElementById('content');
  const sm=SM.find(s=>s.id===curStep);
  if(curTab==='learn'){
    el.innerHTML=`<h2 style="font-size:20px;font-weight:800;margin-bottom:4px">${sm.emoji} ขั้นที่ ${curStep}: ${sm.title}</h2>
      <p style="color:var(--mu);font-size:13px;margin-bottom:24px">ค32201 · ภาคเรียน 1/2569</p>
      ${C[curStep].theory}`;
  } else {
    renderQuiz(el, sm);
  }
}

function renderQuiz(el, sm){
  if(!quiz){
    el.innerHTML=`<div style="padding:40px;text-align:center;color:var(--mu)">⚠ โหลดแบบทดสอบไม่ได้ — ลองรีเฟรชหน้าใหม่</div>`;
    return;
  }
  const total=quiz.length;
  el.innerHTML=`<h2 style="font-size:20px;font-weight:800;margin-bottom:4px">✏️ แบบทดสอบ ขั้น ${curStep}</h2>
    <p style="color:var(--mu);font-size:13px;margin-bottom:20px">${total} ข้อ · ผ่านเกณฑ์ ${Math.ceil(total*0.8)} ข้อ (80%)</p>
    <div id="result"></div>
    ${quiz.map((q,i)=>renderQ(q,i)).join('')}
    <div style="margin-top:20px;display:flex;gap:10px;align-items:center" id="quizBtns">
      ${submitted
        ?`<button class="btn btn-gh" onclick="resetQuiz()">🔄 ทำใหม่</button>`
        :`<button class="btn btn-ac" onclick="submitQuiz()">ส่งคำตอบ</button>`}
    </div>`;
}

function renderQ(q,i){
  if(q.type==='mc'){
    const dis=submitted?' disabled':'';
    return `<div class="q-item" id="qi-${i}">
      <div class="q-num">ข้อที่ ${i+1}</div>
      <div class="q-stem">${q.stem}</div>
      <div class="choices">
        ${q.choices.map((c,j)=>`<div class="choice${userAns[i]===j?' selected':''}" id="ch-${i}-${j}" onclick="pickMC(${i},${j})">
          <div class="choice-dot"></div><span>${c}</span>
        </div>`).join('')}
      </div>
      <div class="q-feedback" id="fb-${i}"></div>
      <div class="q-explain" id="ex-${i}">${q.explain}</div>
    </div>`;
  } else {
    return `<div class="q-item" id="qi-${i}">
      <div class="q-num">ข้อที่ ${i+1}</div>
      <div class="q-stem">${q.stem}</div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <button class="sign-btn" onclick="toggleSign(${i})" ${submitted?'disabled':''}>±</button>
        <input class="num-input" id="ni-${i}" type="text" inputmode="decimal"
          placeholder="คำตอบ" value="${userAns[i]!==undefined?userAns[i]:''}"
          oninput="userAns[${i}]=parseFloat(this.value)"
          ${submitted?'disabled':''}>
        ${q.unit?`<span style="font-size:14px">${q.unit}</span>`:''}
      </div>
      <div class="q-feedback" id="fb-${i}"></div>
      <div class="q-explain" id="ex-${i}">${q.explain}</div>
    </div>`;
  }
}

function toggleSign(i){
  if(submitted) return;
  const inp=document.getElementById('ni-'+i);
  const raw=inp.value.trim();
  if(raw===''||raw==='-'){
    inp.value = raw==='-' ? '' : '-';
  } else {
    const v=parseFloat(raw);
    if(!isNaN(v)){ inp.value=String(-v); }
  }
  userAns[i]=parseFloat(inp.value);
}

function pickMC(qi,ci){
  if(submitted) return;
  userAns[qi]=ci;
  document.querySelectorAll(`[id^="ch-${qi}-"]`).forEach((el,j)=>{
    el.classList.toggle('selected',j===ci);
  });
}

function submitQuiz(){
  submitted=true;
  let score=0;
  quiz.forEach((q,i)=>{
    const fb=document.getElementById(`fb-${i}`);
    const ex=document.getElementById(`ex-${i}`);
    let ok=false;
    if(q.type==='mc'){
      const ans=userAns[i];
      ok=(ans===q.answer);
      q.choices.forEach((_,j)=>{
        const el=document.getElementById(`ch-${i}-${j}`);
        if(!el) return;
        el.classList.add('disabled');
        if(j===q.answer) el.classList.add('correct');
        else if(j===ans&&!ok) el.classList.add('wrong');
      });
    } else {
      const v=userAns[i];
      ok=(v!==undefined&&!isNaN(v)&&Math.abs(v-q.answer)<=q.tol);
      const ni=document.getElementById(`ni-${i}`);
      ni.classList.add(ok?'correct':'wrong');
      if(!ok) ni.placeholder=`เฉลย: ${q.answer}`;
    }
    if(ok) score++;
    fb.innerHTML=ok?'<span class="q-feedback ok">✅ ถูกต้อง</span>':'<span class="q-feedback ng">❌ ผิด</span>';
    ex.classList.add('show');
  });
  showResult(score, quiz.length);
  document.getElementById('quizBtns').innerHTML=`<button class="btn btn-gh" onclick="resetQuiz()">🔄 ทำใหม่</button>`;
}

function showResult(s, t){
  const pct=s/t;
  const pass=pct>=0.8;
  const el=document.getElementById('result');
  el.style.display='block';
  el.innerHTML=`<div class="score">${s}/${t}</div>
    <div class="verdict ${pass?'result-pass':'result-fail'}">${pass?'🎉 ผ่านเกณฑ์!':'😅 ยังไม่ผ่าน — ลองใหม่ได้เลย'}</div>
    ${pass?`<div class="ready-box">✅ พร้อมแล้ว! ไปหาครูเพื่อขอ <b>Quiz จริง</b> แล้ว unlock ขั้น ${curStep} ได้เลยครับ 🚀</div>`
          :`<div style="color:var(--mu);font-size:13px">กลับไปอ่าน <b>ใบความรู้</b> แล้วลองทำแบบทดสอบใหม่</div>`}`;
  el.scrollIntoView({behavior:'smooth'});
}

function resetQuiz(){
  quiz=C[curStep].makeQ(); userAns={}; submitted=false;
  renderContent();
}

// ── Init ──────────────────────────────────────────────
const _urlStep = parseFloat(new URLSearchParams(location.search).get('step'));
if (!isNaN(_urlStep) && SM.find(s=>s.id===_urlStep)) curStep = _urlStep;
buildSidebar();
renderContent();
fetchHorizon();
setInterval(fetchHorizon, 60000);
</script>
