<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MathEQ — ทดสอบสาย L</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;background:#070b16;color:#dce8f5;font-family:'TH Sarabun New','Sarabun',system-ui,sans-serif;font-size:19px;min-height:100vh}

.ch:hover:not(:disabled){border-color:#0d47a1!important}.ch.ok{background:#c9efd5!important;border-color:#2e9b55!important}.ch.no{background:#ffd9d6!important;border-color:#d65a50!important}

table.mx{display:inline-table;border-left:2px solid #1a2233;border-right:2px solid #1a2233;border-radius:6px;margin:0 6px;vertical-align:middle;border-collapse:collapse}table.mx td{padding:1px 8px;text-align:center}

</style></head><body><div class="wrap">
<div id="vTest">
 <div class="row" style="margin-bottom:10px"><button id="btnQuit">← กลับ MathEQ</button><span class="muted" id="tTitle"></span></div>
 <div id="tIntro" class="tcard"></div>
 <div id="tQ" class="hide"><div class="tcard"><div class="muted" id="stepName"></div><div class="q" id="q"></div><div id="ans"></div><div id="fb"></div></div></div>
 <div id="tR" class="hide">
  <div class="tcard"><div class="muted" id="rSub"></div><div class="big" id="rTitle"></div><p id="rDesc"></p><div class="ladder" id="rLadder"></div><div class="muted" id="saveSt"></div></div>
  <div class="tcard"><b>จุดที่ควรทบทวน</b><div id="rWrong"></div></div>

 </div>

<script>
const SID="L";
let API_URL="";try{API_URL=sessionStorage.getItem("matheq_api")||""}catch(e){}
const DEMO=!API_URL;
let TOKEN=null;try{const s=JSON.parse(sessionStorage.getItem("matheq_sess")||"null");TOKEN=s&&s.token}catch(e){}
if(!TOKEN){location.replace("MathEQ.html")}
// ===== คลังข้อสอบสาย N (สร้างข้อจากเลขสุ่ม) =====
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
const sup=n=>String(n).split('').map(c=>SUP[c]).join('');
const sgn=n=>n<0?'−'+(-n):''+n;                       // แสดงเครื่องหมายลบแบบ −
const par=n=>n<0?'(−'+(-n)+')':''+n;                  // ใส่วงเล็บถ้าติดลบ
const frac=(n,d)=>{const g=gcd(n,d);n/=g;d/=g;return d===1?String(n):n+'/'+d};
const fh=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
// mc: correct + wrongs [{t,tag}]
function MC(q,ans,wrongs,exp){
  const seen=new Set([String(ans)]);const w=[];
  for(const x of wrongs){const k=String(x.t);if(!seen.has(k)){seen.add(k);w.push(x)}}
  const fill=[];let i=1;while(w.length+fill.length<3){const t=typeof ans==='number'?ans+i*(i%2?1:-1)*R(1,3):ans+'?'.repeat(i);const k=String(t);if(!seen.has(k)){seen.add(k);fill.push({t,tag:'คำนวณคลาดเคลื่อน'})}i++}
  const ch=shuffle([{t:ans,ok:1},...w.slice(0,3).concat(fill).slice(0,3)]);
  return {type:'mc',q,ans,choices:ch,exp};
}
// num: ตอบพิมพ์ — hints [{v,tag}] เฉพาะคำตอบผิดที่พบบ่อย
function NUM(q,ans,hints,exp){return {type:'num',q,ans:String(ans),hints:hints||[],exp}}


const TB=(head,rows)=>`<table class="t"><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table>`;
const TFL=['จริง','เท็จ','ไม่สามารถบอกได้','ไม่เป็นทั้งจริงและเท็จ'];
function TF(q,v,exp,tag){const ok=v?'จริง':'เท็จ';return MC(q,ok,TFL.filter(x=>x!==ok).map(x=>({t:x,tag:x===(v?'เท็จ':'จริง')?(tag||'ประเมินค่าความจริงผิด'):'ทุกประพจน์มีค่าความจริงแน่นอน'})),exp)}
const sgx=n=>n<0?`− ${-n}`:`+ ${n}`;
const pt=(a,b)=>`(${sgn(a)}, ${sgn(b)})`;
const sg=n=>n<0?`− ${-n}`:`+ ${n}`;


const META={sid:'L',name:'เซตและตรรกศาสตร์',base:'ตอนนี้ควรเริ่มซ่อมจากขั้น L1 (ความหมายและสัญลักษณ์ของเซต) ก่อน แล้วค่อยไล่ขึ้นไปทีละขั้น',note:p=>'สายนี้เป็นเนื้อหาของ ม.4 ถ้านักเรียนยังไม่เคยเรียน ผลที่ได้เป็นการวัดพื้นฐานก่อนเรียน'};
const st=a=>'{'+a.join(', ')+'}';
function subset(n,k){const a=[];while(a.length<k){const x=R(1,n);if(!a.includes(x))a.push(x)}return a.sort((x,y)=>x-y)}
var STEPS=[
{id:'L1',name:'เซตและสัญลักษณ์',gen:[
 ()=>{const L=shuffle(['a','b','c','d','e','f']).slice(0,3);const x=L[1];return MC(`ให้ A = {${L.join(', ')}} ข้อใดเขียนสัญลักษณ์ได้ถูกต้อง`,`${x} ∈ A`,[{t:`${x} ⊂ A`,tag:'ใช้ ⊂ กับสมาชิก (⊂ ใช้กับเซต)'},{t:`{${x}} ∈ A`,tag:'ใช้ ∈ กับเซตแทนสมาชิก'},{t:`A ∈ ${x}`,tag:'สลับทิศทางของ ∈'}],'∈ ใช้ระหว่างสมาชิกกับเซต')},
 ()=>{const a=R(-3,3),b=a+R(3,8);return NUM(`จำนวนสมาชิกของเซต {x ∈ ℤ | ${sgn(a)} ≤ x ≤ ${b}} เท่ากับเท่าใด`,b-a+1,[{v:b-a,tag:'นับสมาชิกไม่ครบ (ลืมนับปลายทั้งสองข้าง)'}],'นับจำนวนเต็มรวมปลายทั้งสองข้าง')},
 ()=>{const fin=['{1, 2, 3}','{x ∈ ℕ | x < 10}','{x ∈ ℤ | 1 ≤ x ≤ 5}'],inf=['ℕ (จำนวนนับ)','{x ∈ ℤ | x > 5}','{2, 4, 6, …} (จำนวนคู่บวก)'];return MC('ข้อใดเป็นเซตอนันต์',pick(inf),shuffle(fin).map(x=>({t:x,tag:'แยกเซตจำกัด/อนันต์ไม่ถูก'})),'เซตอนันต์คือเซตที่สมาชิกไม่มีที่สิ้นสุด')},
 ()=>{const L=shuffle(['a','b','c','d']).slice(0,3);const arr=[...L,L[0],L[1]];return NUM(`n({${shuffle(arr).join(', ')}}) เท่ากับเท่าใด`,3,[{v:5,tag:'นับสมาชิกที่ซ้ำกันซ้ำอีก'}],'สมาชิกที่ซ้ำกันนับเป็นตัวเดียว')}]},
{id:'L2',name:'สับเซต เพาเวอร์เซต แผนภาพเวนน์-ออยเลอร์',gen:[
 ()=>{const n=R(3,6);return NUM(`เซต A มีสมาชิก ${n} ตัว A มีสับเซตทั้งหมดกี่เซต`,Math.pow(2,n),[{v:n*n,tag:'ใช้ n² แทน 2ⁿ'},{v:2*n,tag:'ใช้ 2n แทน 2ⁿ'}].filter(h=>h.v!==Math.pow(2,n)),'จำนวนสับเซต = 2ⁿ')},
 ()=>{const n=R(3,5);return NUM(`เซต A มีสมาชิก ${n} ตัว A มีสับเซตแท้กี่เซต`,Math.pow(2,n)-1,[{v:Math.pow(2,n),tag:'นับ A ที่เป็นสับเซตไม่แท้ด้วย'}],'สับเซตแท้ = 2ⁿ − 1')},
 ()=>{const n=R(4,6);return NUM(`เซต A = {1, 2, …, ${n}} มีสับเซตที่มีสมาชิก 2 ตัวกี่เซต`,n*(n-1)/2,[{v:n*(n-1),tag:'นับเรียงลำดับ ทั้งที่เซตไม่สนใจลำดับ'}],'ใช้การจัดหมู่ C(n,2)')},
 ()=>MC('A ⊂ B หมายความว่าข้อใด','สมาชิกทุกตัวของ A เป็นสมาชิกของ B',[{t:'สมาชิกทุกตัวของ B เป็นสมาชิกของ A',tag:'สลับเซตที่เป็นสับเซต'},{t:'A กับ B ไม่มีสมาชิกร่วมกัน',tag:'สับสนกับเซตที่ไม่มีส่วนร่วม'},{t:'A และ B มีจำนวนสมาชิกเท่ากันเสมอ',tag:'สับเซตไม่จำเป็นต้องมีจำนวนเท่ากัน'}],'A ⊂ B: A อยู่ใน B')]},
{id:'L3',name:'การดำเนินการของเซตและจำนวนสมาชิก',gen:[
 ()=>{const a=R(8,20),b=R(8,20),c=R(2,6);return NUM(`n(A) = ${a}, n(B) = ${b}, n(A ∩ B) = ${c} แล้ว n(A ∪ B) เท่ากับเท่าใด`,a+b-c,[{v:a+b,tag:'ลืมลบส่วนที่ซ้อนกัน n(A ∩ B)'}],'n(A∪B) = n(A) + n(B) − n(A∩B)')},
 ()=>{const A=subset(8,4),B=subset(8,4);const I=A.filter(x=>B.includes(x));if(!I.length)return STEPS[2].gen[1]();const U=[...new Set([...A,...B])].sort((x,y)=>x-y);const ok=st(I);return MC(`ให้ A = ${st(A)} และ B = ${st(B)} แล้ว A ∩ B เท่ากับข้อใด`,ok,[{t:st(U),tag:'ใช้ยูเนียนแทนอินเตอร์เซกชัน'},{t:st(A.filter(x=>!B.includes(x))),tag:'ตอบ A − B แทน A ∩ B'},{t:st(B.filter(x=>!A.includes(x))),tag:'ตอบ B − A แทน A ∩ B'}],'A ∩ B คือสมาชิกที่อยู่ทั้ง A และ B')},
 ()=>{const U=R(10,16),a=R(3,7);return NUM(`เอกภพสัมพัทธ์ U มีสมาชิก ${U} ตัว A ⊂ U มีสมาชิก ${a} ตัว แล้ว n(A′) เท่ากับเท่าใด`,U-a,[{v:U+a,tag:'บวกแทนการลบ'}],'n(A′) = n(U) − n(A)')},
 ()=>{const N=R(30,50),a=R(15,25),b=R(10,20),c=R(3,8);return NUM(`นักเรียน ${N} คน ชอบวิชา A จำนวน ${a} คน ชอบวิชา B จำนวน ${b} คน ชอบทั้งสองวิชา ${c} คน มีนักเรียนที่ไม่ชอบทั้งสองวิชากี่คน`,N-(a+b-c),[{v:N-a-b,tag:'ลืมบวกกลับส่วนที่ซ้ำ'}],'ไม่ชอบทั้งสอง = N − n(A∪B)')}]},
{id:'L4',name:'ประพจน์ ตัวเชื่อม และตารางค่าความจริง',gen:[
 ()=>{const P=['5 + 3 = 8','ประเทศไทยอยู่ในทวีปเอเชีย','2 เป็นจำนวนเฉพาะ','7 + 5 = 13'],N=['x + 3 = 8','จงปิดประตู','เธอไปโรงเรียนไหม','ขอให้โชคดี'];return MC('ข้อใดเป็นประพจน์',pick(P),shuffle(N).slice(0,3).map(x=>({t:x,tag:'ประโยคนี้ไม่มีค่าความจริงแน่นอน จึงไม่ใช่ประพจน์'})),'ประพจน์คือประโยคบอกเล่าที่มีค่าความจริงแน่นอน')},
 ()=>{const p=Math.random()<0.5,q=Math.random()<0.5;const op=pick([['∧',p&&q],['∨',p||q],['→',!p||q],['↔',p===q]]);return TF(`ถ้า p เป็น${p?'จริง':'เท็จ'} และ q เป็น${q?'จริง':'เท็จ'} แล้ว p ${op[0]} q มีค่าความจริงเป็นอย่างไร`,op[1],'ตรวจจากตารางค่าความจริงของตัวเชื่อม')},
 ()=>{const k=R(1,9);return MC(`นิเสธของประโยค "x > ${k}" คือข้อใด`,`x ≤ ${k}`,[{t:`x < ${k}`,tag:'ลืมกรณี x = k ในนิเสธ'},{t:`x ≥ ${k}`,tag:'เปลี่ยนเพียงทิศ โดยไม่กลับกรณีเท่ากับ'},{t:`x = ${k}`,tag:'นิเสธของ > ต้องรวมทั้ง < และ ='}],'นิเสธของ > คือ ≤')},
 ()=>{const op=pick([['p ∧ q',1],['p ∨ q',3],['p → q',3],['p ↔ q',2]]);return NUM(`จากตารางค่าความจริง 4 แถวของ ${op[0]} มีกี่แถวที่เป็นจริง`,op[1],[{v:op[1]===3?1:3,tag:'จำค่าความจริงของตัวเชื่อมสลับกัน'}].filter(h=>h.v!==op[1]),'ตรวจทีละแถวตามนิยามตัวเชื่อม')}]},
{id:'L5',name:'ประพจน์สมมูล เดอมอร์แกน สัจนิรันดร์',gen:[
 ()=>{const c=pick([['~(p ∧ q)','~p ∨ ~q'],['~(p ∨ q)','~p ∧ ~q']]);const all=['~p ∨ ~q','~p ∧ ~q','p ∨ q','p ∧ ~q'];return MC(`${c[0]} สมมูลกับข้อใด`,c[1],all.filter(x=>x!==c[1]).slice(0,3).map(x=>({t:x,tag:'ใช้กฎเดอมอร์แกนผิด (ต้องสลับ ∧ กับ ∨ และปฏิเสธทั้งสองตัว)'})),'กฎเดอมอร์แกน')},
 ()=>MC('~(p → q) สมมูลกับข้อใด','p ∧ ~q',[{t:'~p → ~q',tag:'ปฏิเสธเงื่อนไขไม่ได้ทำเช่นนี้'},{t:'~p ∧ q',tag:'ปฏิเสธไม่ถูกต้อง'},{t:'p → ~q',tag:'ปฏิเสธไม่ถูกต้อง'}],'p → q สมมูลกับ ~p ∨ q นิเสธคือ p ∧ ~q'),

 if(body.action==='save'){d[body.token]=d[body.token]||{};d[body.token][body.strand]={passed:body.passed,failedAt:body.failedAt,updated:new Date().toISOString()};demoSave(d);return{ok:true,progress:d[body.token],classAvg:demoAvg(DEMO_ROSTER[body.token].cls)}}
 if(body.action==='adminLogin')return body.password==='demo'?{ok:true,token:'demo'}:{ok:false,error:'รหัสผ่านครูไม่ถูกต้อง (โหมดทดลอง: demo)'};
 if(body.action==='adminData')return{ok:true,students:Object.keys(DEMO_ROSTER).map(id=>({id,name:DEMO_ROSTER[id].name,cls:DEMO_ROSTER[id].cls,no:DEMO_ROSTER[id].no,progress:d[id]||{}}))};
 if(body.action==='adminReset'){if(d[body.id])delete d[body.id][body.strand];demoSave(d);return{ok:true}}
}
async function call(body,errEl){try{const r=await api(body);if(!r.ok&&errEl)errEl.textContent=r.error||'เกิดข้อผิดพลาด';return r}catch(e){if(errEl)errEl.textContent='เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง';return{ok:false}}}


const NEED=2,MAXWRONG=2;let S;
function parseNum(s){s=String(s).trim().replace(/−|–/g,'-').replace(/,/g,'').replace(/[๐-๙]/g,c=>'๐๑๒๓๔๕๖๗๘๙'.indexOf(c)).replace(/\s+/g,'');
 if(!s)return NaN;const m=s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);if(m)return +m[1]/+m[2];return /^-?\d+(\.\d+)?$/.test(s)?+s:NaN}
function same(a,b){return Math.abs(a-b)<1e-9}
function openTest(id){
 CUR=id;S=null;const s=STR.find(x=>x.id===id);
 $('tTitle').textContent=`สาย ${id} ${s.name}`;
 ['tQ','tR'].forEach(x=>$(x).classList.add('hide'));$('tIntro').classList.remove('hide');
 $('tIntro').innerHTML=`<h2 style="color:#0d47a1;margin:0 0 6px">ทดสอบระดับตนเอง — สาย ${id} ${s.name}</h2><p>ข้อสอบจะไล่จากขั้นง่ายไปยาก แต่ละขั้นต้องตอบ<b>ถูก 2 ข้อ</b>จึงขึ้นขั้นถัดไป ถ้า<b>ผิด 2 ข้อในขั้นเดียวกัน</b> ระบบจะหยุดและบอกว่าตอนนี้คุณอยู่ที่ขั้นไหน ไม่ใช่การตัดเกรด ตอบตามที่ทำได้จริง ถ้าไม่รู้กด "ไม่รู้" ได้</p><p>ใช้กระดาษทดได้ แต่<b>ห้ามใช้เครื่องคิดเลข</b> · ผลจะบันทึกให้อัตโนมัติเมื่อจบ</p><button id="btnGo">เริ่มทำข้อสอบ</button>`;
 $('btnGo').onclick=startTest}
function startTest(){S={i:0,right:0,wrong:0,passed:[],failed:-1,wrongTags:[],cur:null,seen:new Set(),n:0};$('tIntro').classList.add('hide');$('tQ').classList.remove('hide');nextQ()}
function nextQ(){
 const st=STEPS[S.i];let q,tries=0;do{q=pick(st.gen)();tries++}while(S.seen.has(q.q)&&tries<30);S.seen.add(q.q);S.cur=q;
 S.n++;$('stepName').textContent=`ข้อที่ ${S.n}`;$('q').innerHTML=q.q;$('fb').innerHTML='';
 const a=$('ans');a.innerHTML='';
 if(q.type==='mc'){q.choices.forEach((c,ix)=>{const b=document.createElement('button');b.className='ch';b.innerHTML=String(c.t);b.onclick=()=>answer(ix);a.appendChild(b)})}
 else{a.innerHTML='<div class="row"><input type="text" id="inp" autocomplete="off" placeholder="พิมพ์คำตอบ"><button id="sub">ส่งคำตอบ</button></div>';
  $('sub').onclick=()=>answer($('inp').value);$('inp').onkeydown=e=>{if(e.key==='Enter')answer($('inp').value)};$('inp').focus()}
 const sk=document.createElement('div');sk.style.marginTop='10px';sk.innerHTML='<button class="skip" id="skip">ไม่รู้ / ข้ามข้อนี้</button>';a.appendChild(sk);$('skip').onclick=()=>answer(null)}
function answer(v){
 const q=S.cur;let ok=false,tag='';
 if(v===null){tag='ไม่รู้ / ข้าม'}
 else if(q.type==='mc'){const c=q.choices[v];ok=!!c.ok;tag=ok?'':(c.tag||'เลือกคำตอบผิด');
  [...document.querySelectorAll('.ch')].forEach((b,ix)=>{b.disabled=true;if(q.choices[ix].ok)b.classList.add('ok');else if(ix===v)b.classList.add('no')})}
 else{const n=parseNum(v);if(isNaN(n)){$('fb').innerHTML='<div class="fb no">พิมพ์ตัวเลขหรือเศษส่วน เช่น 12, −5, 3/4, 0.25</div>';return}
  ok=same(n,parseNum(q.ans));if(!ok){const h=q.hints.find(h=>same(n,parseNum(h.v)));tag=h?h.tag:'คำนวณคลาดเคลื่อน'}
  $('inp').disabled=true;$('sub').disabled=true}
 $('skip').disabled=true;
 if(ok)S.right++;else{S.wrong++;S.wrongTags.push({step:STEPS[S.i].id,tag})}
 const done=S.right>=NEED||S.wrong>=MAXWRONG;
 $('fb').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'✓ ถูกต้อง':'✗ ยังไม่ถูก'+(tag&&v!==null?` — ${tag}`:'')}<br><span class="muted">${q.exp}</span></div><div style="margin-top:10px"><button id="nx">${done?'ต่อไป':'ข้อถัดไป'}</button></div>`;
 $('nx').onclick=()=>{
  if(S.right>=NEED){S.passed.push(S.i);S.i++;S.right=S.wrong=0;S.seen=new Set();if(S.i>=STEPS.length){S.done=true;return finish()}return nextQ()}
  if(S.wrong>=MAXWRONG){S.failed=S.i;S.done=true;return finish()}
  nextQ()}}
async function finish(){
 $('tQ').classList.add('hide');$('tR').classList.remove('hide');
 const ids=S.passed.map(k=>STEPS[k].id),top=ids.length?ids[ids.length-1]:null,nx=S.failed>=0?STEPS[S.failed]:null;
 $('rSub').textContent=`ผลการประเมินตนเอง · สาย ${CUR}`;
 $('rTitle').textContent=top?`ผ่านถึงขั้น ${top}`:'ยังไม่ผ่านขั้น '+STEPS[0].id;
 let d=!top?META.base:!nx?'ผ่านทุกขั้นของสายนี้ — เก่งมาก!':`ขั้นถัดไปที่ควรฝึกคือ <b>${nx.id} · ${nx.name}</b>`;
 const nt=META.note(S.passed);if(nt)d+='<br><span class="muted">'+nt+'</span>';
 $('rDesc').innerHTML=d;
 $('rLadder').innerHTML=STEPS.map((s,k)=>`<span class="chip ${S.passed.includes(k)?'pass':S.failed===k?'fail':''}">${s.id}</span>`).join('');
 const g={};S.wrongTags.forEach(w=>{if(!g[w.tag])g[w.tag]={n:0,steps:new Set()};g[w.tag].n++;g[w.tag].steps.add(w.step)});
 const items=Object.entries(g).filter(([t])=>t&&t!=='ไม่รู้ / ข้าม').map(([t,x])=>`<li>${t} <span class="muted">(${[...x.steps].join(', ')})</span></li>`);
 const sk=(g['ไม่รู้ / ข้าม']||{n:0}).n;
 $('rWrong').innerHTML=(items.length?'<ul>'+items.join('')+'</ul>':'<p class="muted">ไม่มีจุดผิดที่ระบุได้</p>')+(sk?`<p class="muted">ข้ามข้อ ${sk} ข้อ</p>`:'');
 $('saveSt').textContent='กำลังบันทึกผล…';
 const r=await call({action:'save',token:TOKEN,strand:CUR,passed:ids,failedAt:nx?nx.id:''});
 if(r.ok){PROG=r.progress;AVG=r.classAvg||AVG;$('saveSt').textContent='✓ บันทึกผลเรียบร้อยแล้ว'}
 else{PROG[CUR]={passed:ids,failedAt:nx?nx.id:'',updated:new Date().toISOString()};$('saveSt').textContent='⚠ บันทึกไม่สำเร็จ — ถ่ายภาพหน้าจอนี้ส่งครู (ผ่านถึง '+(top||'-')+')'}}
$('btnHome').onclick=()=>{location.href='MathEQ.html?s='+CUR};
$('btnQuit').onclick=()=>{if(S&&S.n&&!S.done&&!confirm('ออกกลางคัน ผลจะไม่ถูกบันทึก ต้องการออกหรือไม่?'))return;location.href='MathEQ.html?s='+CUR};


if(TOKEN)openTest(SID);
</script></body></html>
