(function(){try{var st=document.createElement('style');st.textContent='.rd{white-space:nowrap}.rr{border-top:.075em solid currentColor;padding:0 .1em 0 .06em;margin-left:.02em}';(document.head||document.documentElement).appendChild(st)}catch(e){}})();
function mxRt(s){
 if(s.indexOf('\u221a')<0)return s;
 s=s.replace(/\u221a\(([^()]*)\)/g,function(m,x){return '<span class="rd">\u221a<span class="rr">'+x+'</span></span>'});
 return s.replace(/\u221a(\d+(?:\.\d+)?|[A-Za-z]+)/g,function(m,x){return '<span class="rd">\u221a<span class="rr">'+x+'</span></span>'});
}
/* MathEQ: เศษส่วนแบบบน-ล่าง + วิธีทำที่เครื่องหมาย = ตรงกัน (ใช้ทุกหน้า) — ไม่ใช้ lookbehind เพื่อรองรับ iOS รุ่นเก่า */
function mxFrText(s){
 s=mxRt(s);
 s=s.replace(/(\([^()]*\)|[A-Za-z0-9]+!)\/(\([^()]*\)!|[A-Za-z0-9]+!)/g,function(m,n,d){var nu=n.charAt(0)==='('?n.slice(1,-1):n,de=d.charAt(0)==='('?d.slice(1,-2)+'!':d;if(n.charAt(0)==='('&&n.indexOf('!')<0)return m;return '<span class="fr"><i>'+nu+'</i><i>'+(d.charAt(0)==='('?'('+d.slice(1,-2)+')!':d)+'</i></span>'});
 s=s.replace(/(^|[^\w\/.])([A-Za-z])\/(\d+)(?![\d\/\u00b2\u00b3])/g,function(m,p,v,d){return p+'<span class="fr"><i>'+v+'</i><i>'+d+'</i></span>'});
 return s.replace(/(?:(\d+) )?(\d+)\/(\d+)/g,function(m,w,n,d,o,str){
  var b=o>0?str.charAt(o-1):'',a=str.charAt(o+m.length);
  if(/[\w\/.√)\]²³′π]/.test(b)||/[\d\/²³√]/.test(a))return m;
  return (w?w:'')+'<span class="fr"><i>'+n+'</i><i>'+d+'</i></span>'});
}
/* รับ HTML string คืน HTML string (ไม่แตะข้างในแท็ก) */
function mxFr(h){
 return String(h).split(/(<\/?[a-zA-Z][^>]*>)/).map(function(x){return x.charAt(0)==='<'&&/^<\/?[a-zA-Z]/.test(x)?x:mxFrText(x)}).join('');
}
/* rows = [[ข้อความซ้าย, ข้อความขวา, ไม่แสดง =], ...] เฉพาะแถวสุดท้ายตัวหนา */
function mxEq(rows){
 var n=rows.length;
 return '<table class="eqt">'+rows.map(function(r,i){return '<tr><td class="el">'+mxFr(r[0]||'')+'</td><td class="ee">'+(r[2]?'':'=')+'</td><td class="er">'+(i===n-1?'<b>'+mxFr(r[1])+'</b>':mxFr(r[1]))+'</td></tr>'}).join('')+'</table>';
}
function mxSplitEq(line){
 var parts=[],depth=0,inTag=false,start=0,i,ch;
 for(i=0;i<line.length;i++){
  ch=line.charAt(i);
  if(ch==='<'&&/[a-zA-Z\/]/.test(line.charAt(i+1)))inTag=true;
  else if(ch==='>'&&inTag)inTag=false;
  if(inTag)continue;
  if('([{'.indexOf(ch)>=0)depth++;
  else if(')]}'.indexOf(ch)>=0)depth--;
  else if(depth===0&&ch==='='&&line.charAt(i-1)===' '&&line.charAt(i+1)===' '){parts.push(line.slice(start,i-1));start=i+2}
 }
 parts.push(line.slice(start));
 return parts;
}
function mxTagsOk(s){
 var o=(s.match(/<[a-zA-Z][^>]*>/g)||[]).length,c=(s.match(/<\/[a-zA-Z]+>/g)||[]).length;
 return o===c;
}
function mxPlain(s){return s.replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')}
function mxCommaFree(pt){
 var d=0,j,c;
 for(j=0;j<pt.length;j++){c=pt.charAt(j);if('([{'.indexOf(c)>=0)d++;else if(')]}'.indexOf(c)>=0)d--;else if(d===0&&c===',')return false}
 return true;
}
/* ตรวจชิ้นส่วนของสายสมการ: แต่ละชิ้นต้องไม่ว่าง แท็กครบคู่ ไม่มีจุลภาคระดับนอก และชิ้นกลางไม่ใช่ "ประโยคใหม่" ติดมา */
function mxPartsOk(p){
 for(var i=0;i<p.length;i++){
  var pt=mxPlain(p[i]).trim();
  if(!pt||!mxTagsOk(p[i])||!mxCommaFree(pt))return false;
  if(i>0&&i<p.length-1&&/[\w)\]²³′″]\s+[A-Za-zα-ωπ][A-Za-z0-9α-ωπ′″]*(\([^()]*\))?$/.test(pt))return false;
 }
 return true;
}
function mxChainTable(p){
 return '<table class="eqt">'+p.map(function(x,i){return '<tr><td class="el"></td><td class="ee">'+(i===0?'':'=')+'</td><td class="er">'+x.trim()+'</td></tr>'}).join('')+'</table>';
}
function mxRowsTable(rows){
 return '<table class="eqt">'+rows.map(function(r){return '<tr><td class="el">'+r[0].trim()+'</td><td class="ee">=</td><td class="er">'+r[1].trim()+'</td></tr>'}).join('')+'</table>';
}
/* segs = รายการ "ประโยคสมการ" ที่แยกกันด้วย → หรือ · (ตัวคั่นแบบเว้นกว้าง) */
function mxStmts(segs,allowChain){
 var allOne=true,allChain=true,parsed=[],i,p;
 for(i=0;i<segs.length;i++){
  p=mxSplitEq(segs[i]);
  if(!mxPartsOk(p))return null;
  parsed.push(p);
  if(p.length!==2)allOne=false;
  if(p.length<3)allChain=false;
 }
 if(allOne)return mxRowsTable(parsed);
 if(allowChain&&allChain)return parsed.map(mxChainTable).join('');
 return null;
}
/* คืน HTML ตาราง ถ้าบรรทัดนี้เป็นสายสมการล้วน ไม่งั้นคืน null */
var MX_SEP=/(?:&nbsp;| ){2,}·(?:&nbsp;| ){2,}/;
function mxThaiLhsOnly(segs){
 for(var i=0;i<segs.length;i++){
  var p=mxSplitEq(segs[i]);
  for(var j=1;j<p.length;j++)if(/[\u0e00-\u0e7f]/.test(mxPlain(p[j])))return false;
 }
 return true;
}
function mxThaiN(x){var m=mxPlain(x).match(/[\u0e00-\u0e7f]/g);return m?m.length:0}
/* สายขั้นตอนที่คั่นด้วย → มีคำไทยสั้น ๆ ปนได้: ขั้นที่มี = ครั้งเดียวเรียงเป็นแถวให้ = ตรงกัน ขั้นอื่นเป็นแถวข้อความ */
function mxArrowRows(line){
 var steps=line.split(/\s+\u2192\s+/),rows=[],eq=0,i,j,p,t;
 if(steps.length<2)return null;
 for(i=0;i<steps.length;i++){
  if(!mxTagsOk(steps[i]))return null;
  p=mxSplitEq(steps[i]);
  if(p.length===2){
   if(!mxCommaFree(mxPlain(p[0]))||mxThaiN(p[0])>12||mxThaiN(p[1])>12||!mxPlain(p[0]).trim()||!mxPlain(p[1]).trim())return null;
   if(/[\w)\]]\s+[A-Za-z]\w*$/.test(mxPlain(p[0]).trim())&&/[0-9]\s+[A-Za-z]/.test(mxPlain(p[0])))return null;
   rows.push('<tr><td class="el">'+p[0].trim()+'</td><td class="ee">=</td><td class="er">'+p[1].trim()+'</td></tr>');eq++;
  }else if(p.length===1){
   t=mxPlain(steps[i]).trim();
   if(!t||t.length>34)return null;
   rows.push('<tr><td colspan="3" style="text-align:left">'+steps[i].trim()+'</td></tr>');
  }else return null;
 }
 if(eq<2)return null;
 return '<table class="eqt">'+rows.join('')+'</table>';
}
function mxChain(line){
 line=line.replace(/<\/?(?:b|strong)>/gi,'');
 var t=mxPlain(line),thai=/[\u0e00-\u0e7f]/.test(t);
 if(/[\u21d2\u21d4\u2194;]/.test(t))return null;
 if(t.indexOf(' = ')<0)return null;
 var segs=line.split(MX_SEP);
 if(segs.length>1){
  for(var k=0;k<segs.length;k++)if(/\s\u2192\s/.test(mxPlain(segs[k])))return null;
  if(thai&&!mxThaiLhsOnly(segs))return null;
  return mxStmts(segs,true);
 }
 if(/\s\u2192\s/.test(t)){
  var as=line.split(/\s+\u2192\s+/);
  if(!thai||mxThaiLhsOnly(as)){var r=mxStmts(as,false);if(r)return r}
  return mxArrowRows(line);
 }
 var p=mxSplitEq(line);
 if(thai&&!mxThaiLhsOnly([line]))return null;
 if(p.length<3||!mxPartsOk(p))return null;
 return mxChainTable(p);
}
var MX_BLOCK='table,p,li,div,ul,ol,details,h1,h2,h3';
var MX_SKIP='button,.ch,#ans,#q,input,textarea,.eqt,svg,script,style,.nomfx';
function mxFix(root){
 var els=root.querySelectorAll('p,li,div.sol,.fb,details>div,.mfx'),k;
 for(k=0;k<els.length;k++){
  var el=els[k];
  if(el.closest(MX_SKIP)||el.querySelector(MX_BLOCK))continue;
  var html=el.innerHTML;
  if(html.indexOf(' = ')<0)continue;
  var lines=html.split(/<br\s*\/?>/i),out=[],raw=[],changed=false;
  for(var i=0;i<lines.length;i++){
   var tb=mxChain(lines[i]);
   if(tb){if(raw.length){out.push(raw.join('<br>'));raw=[]}out.push(tb);changed=true}
   else raw.push(lines[i]);
  }
  if(!changed)continue;
  if(raw.length)out.push(raw.join('<br>'));
  el.innerHTML=out.join('');
 }
 /* เศษส่วนบน-ล่าง ในข้อความทุกที่ (ยกเว้น svg/script/style/ช่องกรอก) */
 var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),nodes=[],n;
 while((n=w.nextNode())){
  if(!/\d\/\d|\u221a/.test(n.nodeValue))continue;
  var pe=n.parentNode;
  if(!pe||(pe.closest&&pe.closest('svg,script,style,textarea,.fr,.nomfx,#saveSt,#rDesc,#rTitle,#gProg,#stepName,#rSub')))continue;
  nodes.push(n);
 }
 nodes.forEach(function(nd){
  var t=nd.nodeValue.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  var h=mxFrText(t);
  if(h===t)return;
  var sp=document.createElement('span');sp.innerHTML=h;
  var frag=document.createDocumentFragment();
  while(sp.firstChild)frag.appendChild(sp.firstChild);
  nd.parentNode.replaceChild(frag,nd);
 });
}
(function(){
 var timer=null,obs=null;
 function run(){try{mxFix(document.body)}catch(e){if(window.console)console.error('mxFix',e)}if(obs)obs.takeRecords()}
 function sched(){clearTimeout(timer);timer=setTimeout(run,30)}
 function start(){
  run();
  if(window.MutationObserver){obs=new MutationObserver(sched);obs.observe(document.body,{childList:true,subtree:true,characterData:true})}
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();

<script>
const SID="D";
let API_URL="";try{API_URL=sessionStorage.getItem("matheq_api")||""}catch(e){}
const DEMO=!API_URL;
let TOKEN=null;try{const s=JSON.parse(sessionStorage.getItem("matheq_sess")||"null");TOKEN=s&&s.token}catch(e){}
if(!TOKEN){location.replace("MathEQ.html")}
// ===== คลังข้อสอบสาย N (สร้างข้อจากเลขสุ่ม) =====
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
const sup=n=>String(n).split('').map(c=>SUP[c]).join('');
const sgn=n=>n<0?'−'+(-n):''+n;                       // แสดงเครื่องหมายลบแบบ −
const par=n=>n<0?'(−'+(-n)+')':''+n;                  // ใส่วงเล็บถ้าติดลบ
const frac=(n,d)=>{const g=gcd(n,d);n/=g;d/=g;return d===1?String(n):n+'/'+d};
const fh=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
// mc: correct + wrongs [{t,tag}]
function MC(q,ans,wrongs,exp){
  const seen=new Set([String(ans)]);const w=[];
  for(const x of wrongs){const k=String(x.t);if(!seen.has(k)){seen.add(k);w.push(x)}}
  const fill=[];let i=1;while(w.length+fill.length<3){const t=typeof ans==='number'?ans+i*(i%2?1:-1)*R(1,3):ans+'?'.repeat(i);const k=String(t);if(!seen.has(k)){seen.add(k);fill.push({t,tag:'คำนวณคลาดเคลื่อน'})}i++}
  const ch=shuffle([{t:ans,ok:1},...w.slice(0,3).concat(fill).slice(0,3)]);
  return {type:'mc',q,ans,choices:ch,exp};
}
// num: ตอบพิมพ์ — hints [{v,tag}] เฉพาะคำตอบผิดที่พบบ่อย

{id:'D7',name:'ความคล้ายของรูปเรขาคณิต',gen:[

 ()=>{const [m,n]=pick([[2,3],[3,5],[2,5],[3,4]]);return MC(`รูปสามเหลี่ยมสองรูปคล้ายกัน ด้านที่สมนัยกันยาวเป็นอัตราส่วน ${m} : ${n} พื้นที่ของสองรูปมีอัตราส่วนเท่าใด`,`${m*m} : ${n*n}`,[{t:`${m} : ${n}`,tag:'ใช้อัตราส่วนด้านเป็นอัตราส่วนพื้นที่'},{t:`${2*m} : ${2*n}`,tag:'คูณ 2 แทนการยกกำลังสอง'},{t:`${m*m*m} : ${n*n*n}`,tag:'ยกกำลังสามแทนกำลังสอง'}],'พื้นที่อัตราส่วนเป็นกำลังสองของอัตราส่วนด้าน')},
 ()=>{let s,h;do{s=R(2,5);h=R(3,6)}while(s===h);const k=R(2,4);return NUM(`เสาสูง ${h} ม. ทอดเงายาว ${s} ม. ในเวลาเดียวกัน ต้นไม้เงายาว ${s*k} ม. ต้นไม้สูงกี่เมตร`,h*k,[{v:h+(s*k-s),tag:'ใช้การบวกแทนการคูณด้วยสัดส่วน'}],`สูง : เงา เท่ากัน → ${h}×${k}`)},
 ()=>{const P=R(10,30),k=R(2,4);return NUM(`สามเหลี่ยมรูปหนึ่งมีเส้นรอบรูป ${P} ซม. รูปที่คล้ายกันมีด้านยาวเป็น ${k} เท่า เส้นรอบรูปของรูปใหญ่เป็นกี่เซนติเมตร`,P*k,[{v:P*k*k,tag:'ใช้อัตราส่วนพื้นที่ (กำลังสอง) กับความยาวรอบรูป'}],'ความยาวเป็น k เท่า เส้นรอบรูปเป็น k เท่า')}]},
{id:'D8',name:'ปริมาตรและพื้นที่ผิวกรวย ทรงกลม',gen:[

 ()=>{const r=pick([6,9]);return NUM(`ทรงกลมรัศมี ${r} ซม. มีปริมาตรกี่ลูกบาศก์เซนติเมตร (ตอบเป็นจำนวนเท่าของ π)`,4*r*r*r/3,[{v:4*r*r,tag:'สับสนปริมาตรกับพื้นที่ผิวของทรงกลม'}],`V = 4πr³/3 = ${4*r*r*r/3}π`)},
 ()=>{const r=R(2,9);return NUM(`ทรงกลมรัศมี ${r} ซม. มีพื้นที่ผิวกี่ตารางเซนติเมตร (ตอบเป็นจำนวนเท่าของ π)`,4*r*r,[{v:r*r,tag:'ลืมคูณ 4 (สูตรพื้นที่ผิวทรงกลม)'}],'พื้นที่ผิวทรงกลม = 4πr²')},

 ()=>{const c=2*R(20,70);return NUM(`มุมที่จุดศูนย์กลางเท่ากับ ${c}° มุมในส่วนโค้งที่รองรับส่วนโค้งเดียวกันเท่ากับกี่องศา`,c/2,[{v:2*c,tag:'คูณสองแทนการหารสอง'}],'มุมในส่วนโค้ง = ½ × มุมที่จุดศูนย์กลาง')},

{id:'D12',name:'ภาคตัดกรวย: เรขาคณิตวิเคราะห์ (ต่อยอด)',gen:[

 ()=>{const c=R(1,5);return MC(`พาราโบลา y² = ${4*c}x มีจุดโฟกัสที่จุดใด`,`(${c}, 0)`,[{t:`(${4*c}, 0)`,tag:'ใช้ 4c เป็นพิกัดโฟกัสแทน c'},{t:`(0, ${c})`,tag:'สลับแกน x กับ y'},{t:`(${2*c}, 0)`,tag:'ใช้ 2c แทน c'}],'y² = 4cx มีโฟกัส (c, 0)')}]},

  $('inp').disabled=true;$('sub').disabled=true}
 $('skip').disabled=true;
 if(ok)S.right++;else{S.wrong++;S.wrongTags.push({step:STEPS[S.i].id,tag})}
 const done=S.right>=NEED||S.wrong>=MAXWRONG;
 $('fb').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'✓ ถูกต้อง':'✗ ยังไม่ถูก'+(tag&&v!==null?` — ${tag}`:'')}<br><span class="muted">${q.exp}</span></div><div style="margin-top:10px"><button id="nx">${done?'ต่อไป':'ข้อถัดไป'}</button></div>`;
 $('nx').onclick=()=>{
  if(S.right>=NEED){S.passed.push(S.i);S.i++;S.right=S.wrong=0;S.seen=new Set();if(S.i>=STEPS.length){S.done=true;return finish()}return nextQ()}
  if(S.wrong>=MAXWRONG){S.failed=S.i;S.done=true;return finish()}
  nextQ()}}
async function finish(){
 $('tQ').classList.add('hide');$('tR').classList.remove('hide');
 const ids=S.passed.map(k=>STEPS[k].id),top=ids.length?ids[ids.length-1]:null,nx=S.failed>=0?STEPS[S.failed]:null;
 $('rSub').textContent=`ผลการประเมินตนเอง · สาย ${CUR}`;
 $('rTitle').textContent=top?`ผ่านถึงขั้น ${top}`:'ยังไม่ผ่านขั้น '+STEPS[0].id;
 let d=!top?META.base:!nx?'ผ่านทุกขั้นของสายนี้ — เก่งมาก!':`ขั้นถัดไปที่ควรฝึกคือ <b>${nx.id} · ${nx.name}</b>`;
 const nt=META.note(S.passed);if(nt)d+='<br><span class="muted">'+nt+'</span>';
 $('rDesc').innerHTML=d;
 $('rLadder').innerHTML=STEPS.map((s,k)=>`<span class="chip ${S.passed.includes(k)?'pass':S.failed===k?'fail':''}">${s.id}</span>`).join('');
 const g={};S.wrongTags.forEach(w=>{if(!g[w.tag])g[w.tag]={n:0,steps:new Set()};g[w.tag].n++;g[w.tag].steps.add(w.step)});
 const items=Object.entries(g).filter(([t])=>t&&t!=='ไม่รู้ / ข้าม').map(([t,x])=>`<li>${t} <span class="muted">(${[...x.steps].map(s=>KN.includes(s)?`<a href="kn_${s}.html">${s}</a>`:s).join(', ')})</span></li>`);
 const sk=(g['ไม่รู้ / ข้าม']||{n:0}).n;
 $('rKn').innerHTML=nx&&KN.includes(nx.id)?`<a href="kn_${nx.id}.html"><button class="pri">อ่านใบความรู้ขั้น ${nx.id} ก่อนลองใหม่</button></a>`:'';
 $('rWrong').innerHTML=(items.length?'<ul>'+items.join('')+'</ul>':'<p class="muted">ไม่มีจุดผิดที่ระบุได้</p>')+(sk?`<p class="muted">ข้ามข้อ ${sk} ข้อ</p>`:'');
 $('saveSt').textContent='กำลังบันทึกผล…';
 const r=await call({action:'save',token:TOKEN,strand:CUR,passed:ids,failedAt:nx?nx.id:''});
 if(r.ok){PROG=r.progress;AVG=r.classAvg||AVG;$('saveSt').textContent='✓ บันทึกผลเรียบร้อยแล้ว (ขั้นที่เคยผ่านแล้วจะไม่หายไป)';
  const mp=(PROG[CUR]&&PROG[CUR].passed)||[],mtop=STEPS.filter(s=>mp.includes(s.id)).map(s=>s.id).pop();
  if(mtop){$('rTitle').textContent='ผ่านสะสมถึงขั้น '+mtop;$('rLadder').innerHTML=STEPS.map((s,k)=>`<span class="chip ${mp.includes(s.id)?'pass':(nx&&nx.id===s.id)?'fail':''}">${s.id}</span>`).join('')}}
 else{PROG[CUR]={passed:ids,failedAt:nx?nx.id:'',updated:new Date().toISOString()};$('saveSt').textContent='⚠ บันทึกไม่สำเร็จ — ถ่ายภาพหน้าจอนี้ส่งครู (ผ่านถึง '+(top||'-')+')'}}
$('btnHome').onclick=()=>{location.href='MathEQ.html?s='+CUR};
$('btnQuit').onclick=()=>{if(S&&S.n&&!S.done&&!confirm('ออกกลางคัน ผลจะไม่ถูกบันทึก ต้องการออกหรือไม่?'))return;location.href='MathEQ.html?s='+CUR};


if(TOKEN){call({action:'me',token:TOKEN}).then(r=>{if(r&&r.ok){PROG=r.progress||{};AVG=r.classAvg||AVG}openTest(SID)})}
</script></body></html>
