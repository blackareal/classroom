<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MathEQ — ทดสอบสาย S</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;background:#070b16;color:#dce8f5;font-family:'TH Sarabun New','Sarabun',system-ui,sans-serif;font-size:19px;min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;padding:16px 14px 40px}
h1{margin:0;font-size:26px}h2{margin:0 0 8px;font-size:22px}.sub{color:#7f93aa;font-size:15px;margin:2px 0 12px}

.eq{display:grid;grid-template-columns:repeat(9,1fr);gap:9px;align-items:end;padding:4px}
.band{display:flex;flex-direction:column;align-items:center;min-width:0;cursor:pointer}

.lbl{margin-top:7px;font-weight:700;font-size:20px;color:#fff}.nm{font-size:14px;color:#8fa4bd;text-align:center;line-height:1.2;min-height:34px}
.val{font-size:14px;color:#4dff9a;font-family:'Courier New',monospace;text-align:center}.val.none{color:#6b7a92}

table.tb{width:100%;border-collapse:collapse;font-size:16px}table.tb th,table.tb td{border-bottom:1px solid #1e2a42;padding:4px 6px;text-align:center}table.tb td:first-child,table.tb th:first-child,table.tb td:nth-child(3),table.tb th:nth-child(3){text-align:left}
table.tb th{color:#8fa4bd;position:sticky;top:0;background:#0d1424}
.cell{display:inline-block;min-width:34px;border-radius:5px;padding:0 4px;font-family:'Courier New',monospace}
.sc0{background:#1a2438;color:#6b7a92}.sc1{background:#5a2a20;color:#ffb09a}.sc2{background:#5a4a14;color:#ffe08a}.sc3{background:#14502f;color:#7dffb4}
@media(max-width:700px){.eq{gap:3px}.col{height:200px}.nm{font-size:11px}}

.tcard .muted{color:#5b6b82}
.tcard button{background:#0d47a1;color:#fff;border:0;border-radius:12px;padding:10px 18px}.tcard button.skip{background:#fff;color:#7a869a;border:1px solid #c9d6ea}
.tcard input[type=text]{background:#fff;color:#1a2233;border:2px solid #c9d6ea;border-radius:10px;width:auto}
.q{font-size:25px;margin:6px 0 14px}
.ch{display:block;width:100%;text-align:left;background:#f5f8fe!important;color:#1a2233!important;border:2px solid #d3def2!important;margin:8px 0;padding:11px 14px!important}
.ch:hover:not(:disabled){border-color:#0d47a1!important}.ch.ok{background:#c9efd5!important;border-color:#2e9b55!important}.ch.no{background:#ffd9d6!important;border-color:#d65a50!important}
.tcard .row input{flex:1;min-width:140px}
.fb{margin-top:12px;padding:10px 14px;border-radius:12px}.fb.ok{background:#e4f6ea}.fb.no{background:#fdeceb}
.big{font-size:32px;font-weight:700;color:#0d47a1}
.fr{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.1;margin:0 2px}.fr span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
table.mx{display:inline-table;border-left:2px solid #1a2233;border-right:2px solid #1a2233;border-radius:6px;margin:0 6px;vertical-align:middle;border-collapse:collapse}table.mx td{padding:1px 8px;text-align:center}
table.t{border-collapse:collapse;margin:6px 0}table.t td,table.t th{border:1px solid #aab;padding:2px 12px;text-align:center}

</style></head><body><div class="wrap">
<div id="vTest">
 <div class="row" style="margin-bottom:10px"><button id="btnQuit">← กลับ MathEQ</button><span class="muted" id="tTitle"></span></div>
 <div id="tIntro" class="tcard"></div>
 <div id="tQ" class="hide"><div class="tcard"><div class="muted" id="stepName"></div><div class="q" id="q"></div><div id="ans"></div><div id="fb"></div></div></div>
 <div id="tR" class="hide">
  <div class="tcard"><div class="muted" id="rSub"></div><div class="big" id="rTitle"></div><p id="rDesc"></p><div class="ladder" id="rLadder"></div><div class="muted" id="saveSt"></div></div>
  <div class="tcard"><b>จุดที่ควรทบทวน</b><div id="rWrong"></div></div>
  <div class="row"><button class="pri" id="btnHome">กลับ MathEQ</button></div>
 </div>

<script>
const SID="S";
let API_URL="";try{API_URL=sessionStorage.getItem("matheq_api")||""}catch(e){}
const DEMO=!API_URL;
let TOKEN=null;try{const s=JSON.parse(sessionStorage.getItem("matheq_sess")||"null");TOKEN=s&&s.token}catch(e){}
if(!TOKEN){location.replace("MathEQ.html")}
// ===== คลังข้อสอบสาย N (สร้างข้อจากเลขสุ่ม) =====
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
const sup=n=>String(n).split('').map(c=>SUP[c]).join('');
const sgn=n=>n<0?'−'+(-n):''+n;                       // แสดงเครื่องหมายลบแบบ −
const par=n=>n<0?'(−'+(-n)+')':''+n;                  // ใส่วงเล็บถ้าติดลบ
const frac=(n,d)=>{const g=gcd(n,d);n/=g;d/=g;return d===1?String(n):n+'/'+d};
const fh=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
// mc: correct + wrongs [{t,tag}]
function MC(q,ans,wrongs,exp){
  const seen=new Set([String(ans)]);const w=[];
  for(const x of wrongs){const k=String(x.t);if(!seen.has(k)){seen.add(k);w.push(x)}}
  const fill=[];let i=1;while(w.length+fill.length<3){const t=typeof ans==='number'?ans+i*(i%2?1:-1)*R(1,3):ans+'?'.repeat(i);const k=String(t);if(!seen.has(k)){seen.add(k);fill.push({t,tag:'คำนวณคลาดเคลื่อน'})}i++}
  const ch=shuffle([{t:ans,ok:1},...w.slice(0,3).concat(fill).slice(0,3)]);
  return {type:'mc',q,ans,choices:ch,exp};
}
// num: ตอบพิมพ์ — hints [{v,tag}] เฉพาะคำตอบผิดที่พบบ่อย
function NUM(q,ans,hints,exp){return {type:'num',q,ans:String(ans),hints:hints||[],exp}}


const TB=(head,rows)=>`<table class="t"><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table>`;
const TFL=['จริง','เท็จ','ไม่สามารถบอกได้','ไม่เป็นทั้งจริงและเท็จ'];
function TF(q,v,exp,tag){const ok=v?'จริง':'เท็จ';return MC(q,ok,TFL.filter(x=>x!==ok).map(x=>({t:x,tag:x===(v?'เท็จ':'จริง')?(tag||'ประเมินค่าความจริงผิด'):'ทุกประพจน์มีค่าความจริงแน่นอน'})),exp)}
const sgx=n=>n<0?`− ${-n}`:`+ ${n}`;
const pt=(a,b)=>`(${sgn(a)}, ${sgn(b)})`;
const sg=n=>n<0?`− ${-n}`:`+ ${n}`;

const META={sid:'S',name:'สถิติและความน่าจะเป็น',base:'ตอนนี้ควรเริ่มซ่อมจากขั้น S0 (การอ่านตารางและแผนภาพง่าย ๆ และอัตราส่วน) ก่อน แล้วค่อยไล่ขึ้นไปทีละขั้น',note:p=>'หมายเหตุ: ลำดับขั้นในแบบทดสอบเรียงตามระดับชั้น (ความน่าจะเป็นมาก่อนสถิติ ม.6) รหัสขั้นอาจไม่เรียงตามเลข'};
const lst=a=>a.join(', ');
var STEPS=[
{id:'S0',name:'อ่านตารางและแผนภาพ + อัตราส่วน',gen:[
 ()=>{const v=[R(8,20),R(8,20),R(5,15)];const n=['ฟุตบอล','บาสเกตบอล','วอลเลย์บอล'];return NUM(`ตารางแสดงจำนวนนักเรียนที่ชอบกีฬา<br>${TB(['กีฬา','จำนวน (คน)'],n.map((x,i)=>[x,v[i]]))}ชอบ${n[0]}มากกว่า${n[2]}กี่คน`,v[0]-v[2],[{v:v[0]+v[2],tag:'บวกแทนการหาผลต่าง'}].filter(h=>h.v!==v[0]-v[2]),'หาผลต่างของจำนวนสองกลุ่ม')},
 ()=>{const tot=pick([20,40,50,100]);const p=pick([10,20,25,40,50,60,75].filter(q=>(tot*q)%100===0));const part=tot*p/100;return NUM(`นักเรียนห้องหนึ่งมี ${tot} คน ชอบวิชาคณิตศาสตร์ ${part} คน คิดเป็นร้อยละเท่าใด`,p,[{v:part,tag:'ตอบจำนวนคนแทนร้อยละ'}].filter(h=>h.v!==p),'ร้อยละ = (ส่วน/ทั้งหมด) × 100')},
 ()=>{const m=R(6,16),f=R(6,16);if(m===f)return STEPS[0].gen[2]();const g=gcd(m,f);return MC(`ในห้องมีนักเรียนชาย ${m} คน หญิง ${f} คน อัตราส่วนชายต่อหญิงอย่างต่ำเท่ากับข้อใด`,`${m/g} : ${f/g}`,[{t:`${f/g} : ${m/g}`,tag:'สลับลำดับในอัตราส่วน'},{t:`${m} : ${f}`,tag:'ไม่ได้ทอนอัตราส่วนให้เป็นอย่างต่ำ'},{t:`${m+f} : ${m}`,tag:'ใช้ผลรวมแทนส่วนที่ต้องการ'}].filter(x=>x.t!==`${m/g} : ${f/g}`),'ทอนด้วยตัวหารร่วมมาก')},
 ()=>{const v=[R(5,15),R(5,15),R(5,15),R(5,15)];const n=['เช้า','สาย','บ่าย','เย็น'];return NUM(`ตารางแสดงจำนวนผู้เข้าใช้ห้องสมุด<br>${TB(['ช่วงเวลา','จำนวน (คน)'],n.map((x,i)=>[x,v[i]]))}รวมทั้งวันกี่คน`,v.reduce((a,b)=>a+b),[{v:Math.max(...v),tag:'ตอบค่ามากสุดแทนผลรวม'}].filter(h=>h.v!==v.reduce((a,b)=>a+b)),'บวกจำนวนทุกช่วงเวลา')}]},
{id:'S7',name:'หลักการนับและความน่าจะเป็นเบื้องต้น',gen:[
 ()=>{let a,b;do{a=R(2,6);b=R(2,6)}while(a===2&&b===2);return NUM(`มีเสื้อ ${a} ตัว กางเกง ${b} ตัว แต่งตัวได้ต่างกันกี่แบบ`,a*b,[{v:a+b,tag:'ใช้หลักการบวกแทนหลักการคูณ'}],'ใช้หลักการคูณ')},
 ()=>{const n=R(5,7);return NUM(`เลือกนักเรียน ${n} คน เป็นประธานและรองประธานชมรม (ตำแหน่งต่างกัน) ได้กี่วิธี`,n*(n-1),[{v:n*(n-1)/2,tag:'ใช้การจัดหมู่แทนการเรียงสับเปลี่ยน (ตำแหน่งต่างกันจึงนับลำดับ)'}],'เรียงสับเปลี่ยน P(n,2) = n(n−1)')},
 ()=>{const n=R(4,8);return NUM(`เลือกนักเรียน 2 คนจาก ${n} คนเข้าร่วมกิจกรรม (ไม่แยกตำแหน่ง) ได้กี่วิธี`,n*(n-1)/2,[{v:n*(n-1),tag:'ใช้การเรียงสับเปลี่ยนแทนการจัดหมู่'}],'จัดหมู่ C(n,2) = n(n−1)/2')},
 ()=>{const r=R(2,6),b=R(2,6);if(r===b)return STEPS[1].gen[3]();return NUM(`ในถุงมีลูกบอลสีแดง ${r} ลูก สีน้ำเงิน ${b} ลูก หยิบ 1 ลูก ความน่าจะเป็นที่ได้สีแดง (ตอบเป็นเศษส่วน)`,frac(r,r+b),[{v:frac(r,b),tag:'ใช้อัตราส่วนแดงต่อน้ำเงินแทนความน่าจะเป็น'}],'P = จำนวนที่ต้องการ ÷ ทั้งหมด')}]},
{id:'S1',name:'ความหมายสถิติ ประเภทและระดับการวัดข้อมูล',gen:[
 ()=>{const Q=['สีที่ชอบ','ชนิดอาหารที่ชอบ','ภูมิลำเนา','เกรดที่ได้'],N=['ส่วนสูง','น้ำหนัก','คะแนนสอบ','อายุ'];const ok=pick(N);return MC('ข้อใดเป็นข้อมูลเชิงปริมาณ',ok,shuffle(Q).slice(0,3).map(x=>({t:x,tag:'แยกข้อมูลเชิงคุณภาพ/เชิงปริมาณไม่ถูก'})),'ข้อมูลเชิงปริมาณคือตัวเลขที่วัดหรือนับได้')},
 ()=>{const N=R(400,800),n=R(30,60);return MC(`สำรวจนักเรียนตัวอย่าง ${n} คน จากนักเรียนทั้งโรงเรียน ${N} คน ประชากรคือข้อใด`,`นักเรียนทั้งโรงเรียน ${N} คน`,[{t:`นักเรียน ${n} คนที่ถูกสำรวจ`,tag:'สับสนประชากรกับตัวอย่าง'},{t:'ครูทั้งโรงเรียน',tag:'ไม่ใช่กลุ่มที่ต้องการศึกษา'},{t:`ผลการสำรวจ ${n} คน`,tag:'สับสนข้อมูลกับประชากร'}],'ประชากรคือกลุ่มทั้งหมดที่ต้องการศึกษา')},
 ()=>{const D=['จำนวนพี่น้อง','จำนวนหนังสือในห้องสมุด','จำนวนครั้งที่เข้าห้องสมุด'],C=['น้ำหนัก','ส่วนสูง','เวลาที่ใช้ทำข้อสอบ'];return MC('ข้อใดเป็นข้อมูลต่อเนื่อง',pick(C),shuffle(D).slice(0,3).map(x=>({t:x,tag:'จำแนกข้อมูลต่อเนื่อง/ไม่ต่อเนื่องไม่ถูก (ข้อมูลที่นับได้เป็นจำนวนเต็มคือไม่ต่อเนื่อง)'})),'ข้อมูลต่อเนื่องได้จากการวัด ค่าอาจเป็นทศนิยม')},
 ()=>{const it=pick([['เลขประจำตัวนักเรียน','นามบัญญัติ'],['อันดับที่สอบได้','เรียงอันดับ'],['อุณหภูมิ (°C)','อันตรภาค'],['น้ำหนัก (กก.)','อัตราส่วน']]);const all=['นามบัญญัติ','เรียงอันดับ','อันตรภาค','อัตราส่วน'];return MC(`ข้อมูล "${it[0]}" มีระดับการวัดตรงกับข้อใด`,it[1],all.filter(x=>x!==it[1]).map(x=>({t:x,tag:'ระดับการวัดไม่ตรงกับลักษณะข้อมูล'})),'นามบัญญัติ < เรียงอันดับ < อันตรภาค < อัตราส่วน')}]},
{id:'S2',name:'การนำเสนอข้อมูล: ตาราง แผนภาพ และการเลือกกราฟ',gen:[

function answer(v){

 const g={};S.wrongTags.forEach(w=>{if(!g[w.tag])g[w.tag]={n:0,steps:new Set()};g[w.tag].n++;g[w.tag].steps.add(w.step)});
 const items=Object.entries(g).filter(([t])=>t&&t!=='ไม่รู้ / ข้าม').map(([t,x])=>`<li>${t} <span class="muted">(${[...x.steps].join(', ')})</span></li>`);
 const sk=(g['ไม่รู้ / ข้าม']||{n:0}).n;
 $('rWrong').innerHTML=(items.length?'<ul>'+items.join('')+'</ul>':'<p class="muted">ไม่มีจุดผิดที่ระบุได้</p>')+(sk?`<p class="muted">ข้ามข้อ ${sk} ข้อ</p>`:'');
 $('saveSt').textContent='กำลังบันทึกผล…';
 const r=await call({action:'save',token:TOKEN,strand:CUR,passed:ids,failedAt:nx?nx.id:''});
 if(r.ok){PROG=r.progress;AVG=r.classAvg||AVG;$('saveSt').textContent='✓ บันทึกผลเรียบร้อยแล้ว'}
 else{PROG[CUR]={passed:ids,failedAt:nx?nx.id:'',updated:new Date().toISOString()};$('saveSt').textContent='⚠ บันทึกไม่สำเร็จ — ถ่ายภาพหน้าจอนี้ส่งครู (ผ่านถึง '+(top||'-')+')'}}
$('btnHome').onclick=()=>{location.href='MathEQ.html?s='+CUR};
$('btnQuit').onclick=()=>{if(S&&S.n&&!S.done&&!confirm('ออกกลางคัน ผลจะไม่ถูกบันทึก ต้องการออกหรือไม่?'))return;location.href='MathEQ.html?s='+CUR};


if(TOKEN)openTest(SID);
