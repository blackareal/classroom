(function(){try{var st=document.createElement('style');st.textContent='.rd{white-space:nowrap}.rr{border-top:.075em solid currentColor;padding:0 .1em 0 .06em;margin-left:.02em}';(document.head||document.documentElement).appendChild(st)}catch(e){}})();
function mxRt(s){
 if(s.indexOf('\u221a')<0)return s;
 s=s.replace(/\u221a\(([^()]*)\)/g,function(m,x){return '<span class="rd">\u221a<span class="rr">'+x+'</span></span>'});
 return s.replace(/\u221a(\d+(?:\.\d+)?|[A-Za-z]+)/g,function(m,x){return '<span class="rd">\u221a<span class="rr">'+x+'</span></span>'});
}
/* MathEQ: เศษส่วนแบบบน-ล่าง + วิธีทำที่เครื่องหมาย = ตรงกัน (ใช้ทุกหน้า) — ไม่ใช้ lookbehind เพื่อรองรับ iOS รุ่นเก่า */
function mxFrText(s){
 s=mxRt(s);
 s=s.replace(/(^|[^\w\/.])([A-Za-z])\/(\d+)(?![\d\/\u00b2\u00b3])/g,function(m,p,v,d){return p+'<span class="fr"><i>'+v+'</i><i>'+d+'</i></span>'});
 return s.replace(/(?:(\d+) )?(\d+)\/(\d+)/g,function(m,w,n,d,o,str){
  var b=o>0?str.charAt(o-1):'',a=str.charAt(o+m.length);
  if(/[\w\/.√)\]²³′π]/.test(b)||/[\d\/²³√]/.test(a))return m;
  return (w?w:'')+'<span class="fr"><i>'+n+'</i><i>'+d+'</i></span>'});
}
/* รับ HTML string คืน HTML string (ไม่แตะข้างในแท็ก) */
function mxFr(h){
 return String(h).split(/(<\/?[a-zA-Z][^>]*>)/).map(function(x){return x.charAt(0)==='<'&&/^<\/?[a-zA-Z]/.test(x)?x:mxFrText(x)}).join('');
}
/* rows = [[ข้อความซ้าย, ข้อความขวา, ไม่แสดง =], ...] เฉพาะแถวสุดท้ายตัวหนา */
function mxEq(rows){
 var n=rows.length;
 return '<table class="eqt">'+rows.map(function(r,i){return '<tr><td class="el">'+mxFr(r[0]||'')+'</td><td class="ee">'+(r[2]?'':'=')+'</td><td class="er">'+(i===n-1?'<b>'+mxFr(r[1])+'</b>':mxFr(r[1]))+'</td></tr>'}).join('')+'</table>';
}
function mxSplitEq(line){
 var parts=[],depth=0,inTag=false,start=0,i,ch;
 for(i=0;i<line.length;i++){
  ch=line.charAt(i);
  if(ch==='<'&&/[a-zA-Z\/]/.test(line.charAt(i+1)))inTag=true;
  else if(ch==='>'&&inTag)inTag=false;
  if(inTag)continue;
  if('([{'.indexOf(ch)>=0)depth++;
  else if(')]}'.indexOf(ch)>=0)depth--;
  else if(depth===0&&ch==='='&&line.charAt(i-1)===' '&&line.charAt(i+1)===' '){parts.push(line.slice(start,i-1));start=i+2}
 }
 parts.push(line.slice(start));
 return parts;
}
function mxTagsOk(s){
 var o=(s.match(/<[a-zA-Z][^>]*>/g)||[]).length,c=(s.match(/<\/[a-zA-Z]+>/g)||[]).length;
 return o===c;
}
function mxPlain(s){return s.replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')}
function mxCommaFree(pt){
 var d=0,j,c;
 for(j=0;j<pt.length;j++){c=pt.charAt(j);if('([{'.indexOf(c)>=0)d++;else if(')]}'.indexOf(c)>=0)d--;else if(d===0&&c===',')return false}
 return true;
}
/* ตรวจชิ้นส่วนของสายสมการ: แต่ละชิ้นต้องไม่ว่าง แท็กครบคู่ ไม่มีจุลภาคระดับนอก และชิ้นกลางไม่ใช่ "ประโยคใหม่" ติดมา */
function mxPartsOk(p){
 for(var i=0;i<p.length;i++){
  var pt=mxPlain(p[i]).trim();
  if(!pt||!mxTagsOk(p[i])||!mxCommaFree(pt))return false;
  if(i>0&&i<p.length-1&&/[\w)\]²³′″]\s+[A-Za-zα-ωπ][A-Za-z0-9α-ωπ′″]*(\([^()]*\))?$/.test(pt))return false;
 }
 return true;
}
function mxChainTable(p){
 return '<table class="eqt">'+p.map(function(x,i){return '<tr><td class="el"></td><td class="ee">'+(i===0?'':'=')+'</td><td class="er">'+x.trim()+'</td></tr>'}).join('')+'</table>';
}
function mxRowsTable(rows){
 return '<table class="eqt">'+rows.map(function(r){return '<tr><td class="el">'+r[0].trim()+'</td><td class="ee">=</td><td class="er">'+r[1].trim()+'</td></tr>'}).join('')+'</table>';
}
/* segs = รายการ "ประโยคสมการ" ที่แยกกันด้วย → หรือ · (ตัวคั่นแบบเว้นกว้าง) */
function mxStmts(segs,allowChain){
 var allOne=true,allChain=true,parsed=[],i,p;
 for(i=0;i<segs.length;i++){
  p=mxSplitEq(segs[i]);
  if(!mxPartsOk(p))return null;
  parsed.push(p);
  if(p.length!==2)allOne=false;
  if(p.length<3)allChain=false;
 }
 if(allOne)return mxRowsTable(parsed);
 if(allowChain&&allChain)return parsed.map(mxChainTable).join('');
 return null;
}
/* คืน HTML ตาราง ถ้าบรรทัดนี้เป็นสายสมการล้วน ไม่งั้นคืน null */
var MX_SEP=/(?:&nbsp;| ){2,}·(?:&nbsp;| ){2,}/;
function mxThaiLhsOnly(segs){
 for(var i=0;i<segs.length;i++){
  var p=mxSplitEq(segs[i]);
  for(var j=1;j<p.length;j++)if(/[\u0e00-\u0e7f]/.test(mxPlain(p[j])))return false;
 }
 return true;
}
function mxThaiN(x){var m=mxPlain(x).match(/[\u0e00-\u0e7f]/g);return m?m.length:0}
/* สายขั้นตอนที่คั่นด้วย → มีคำไทยสั้น ๆ ปนได้: ขั้นที่มี = ครั้งเดียวเรียงเป็นแถวให้ = ตรงกัน ขั้นอื่นเป็นแถวข้อความ */
function mxArrowRows(line){
 var steps=line.split(/\s+\u2192\s+/),rows=[],eq=0,i,j,p,t;
 if(steps.length<2)return null;
 for(i=0;i<steps.length;i++){
  if(!mxTagsOk(steps[i]))return null;
  p=mxSplitEq(steps[i]);
  if(p.length===2){
   if(!mxCommaFree(mxPlain(p[0]))||mxThaiN(p[0])>12||mxThaiN(p[1])>12||!mxPlain(p[0]).trim()||!mxPlain(p[1]).trim())return null;
   if(/[\w)\]]\s+[A-Za-z]\w*$/.test(mxPlain(p[0]).trim())&&/[0-9]\s+[A-Za-z]/.test(mxPlain(p[0])))return null;
   rows.push('<tr><td class="el">'+p[0].trim()+'</td><td class="ee">=</td><td class="er">'+p[1].trim()+'</td></tr>');eq++;
  }else if(p.length===1){
   t=mxPlain(steps[i]).trim();
   if(!t||t.length>34)return null;
   rows.push('<tr><td colspan="3" style="text-align:left">'+steps[i].trim()+'</td></tr>');
  }else return null;
 }
 if(eq<2)return null;
 return '<table class="eqt">'+rows.join('')+'</table>';
}
function mxChain(line){
 line=line.replace(/<\/?(?:b|strong)>/gi,'');
 var t=mxPlain(line),thai=/[\u0e00-\u0e7f]/.test(t);
 if(/[\u21d2\u21d4\u2194;]/.test(t))return null;
 if(t.indexOf(' = ')<0)return null;
 var segs=line.split(MX_SEP);
 if(segs.length>1){
  for(var k=0;k<segs.length;k++)if(/\s\u2192\s/.test(mxPlain(segs[k])))return null;
  if(thai&&!mxThaiLhsOnly(segs))return null;
  return mxStmts(segs,true);
 }
 if(/\s\u2192\s/.test(t)){
  var as=line.split(/\s+\u2192\s+/);
  if(!thai||mxThaiLhsOnly(as)){var r=mxStmts(as,false);if(r)return r}
  return mxArrowRows(line);
 }
 var p=mxSplitEq(line);
 if(thai&&!mxThaiLhsOnly([line]))return null;
 if(p.length<3||!mxPartsOk(p))return null;
 return mxChainTable(p);
}
var MX_BLOCK='table,p,li,div,ul,ol,details,h1,h2,h3';
var MX_SKIP='button,.ch,#ans,#q,input,textarea,.eqt,svg,script,style,.nomfx';
function mxFix(root){
 var els=root.querySelectorAll('p,li,div.sol,.fb,details>div,.mfx'),k;
 for(k=0;k<els.length;k++){
  var el=els[k];
  if(el.closest(MX_SKIP)||el.querySelector(MX_BLOCK))continue;
  var html=el.innerHTML;
  if(html.indexOf(' = ')<0)continue;
  var lines=html.split(/<br\s*\/?>/i),out=[],raw=[],changed=false;
  for(var i=0;i<lines.length;i++){
   var tb=mxChain(lines[i]);
   if(tb){if(raw.length){out.push(raw.join('<br>'));raw=[]}out.push(tb);changed=true}
   else raw.push(lines[i]);
  }
  if(!changed)continue;
  if(raw.length)out.push(raw.join('<br>'));
  el.innerHTML=out.join('');
 }
 /* เศษส่วนบน-ล่าง ในข้อความทุกที่ (ยกเว้น svg/script/style/ช่องกรอก) */
 var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),nodes=[],n;
 while((n=w.nextNode())){
  if(!/\d\/\d|\u221a/.test(n.nodeValue))continue;
  var pe=n.parentNode;
  if(!pe||(pe.closest&&pe.closest('svg,script,style,textarea,.fr,.nomfx,#saveSt,#rDesc,#rTitle,#gProg,#stepName,#rSub')))continue;
  nodes.push(n);
 }
 nodes.forEach(function(nd){
  var t=nd.nodeValue.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  var h=mxFrText(t);
  if(h===t)return;
  var sp=document.createElement('span');sp.innerHTML=h;
  var frag=document.createDocumentFragment();
  while(sp.firstChild)frag.appendChild(sp.firstChild);
  nd.parentNode.replaceChild(frag,nd);
 });
}
(function(){
 var timer=null,obs=null;
 function run(){try{mxFix(document.body)}catch(e){if(window.console)console.error('mxFix',e)}if(obs)obs.takeRecords()}
 function sched(){clearTimeout(timer);timer=setTimeout(run,30)}
 function start(){
  run();
  if(window.MutationObserver){obs=new MutationObserver(sched);obs.observe(document.body,{childList:true,subtree:true,characterData:true})}
 }

})();

<script>
/* คลังโจทย์ซ้อมอัจฉริยภาพทางคณิตศาสตร์ ม.ต้น (ใช้ร่วมกันระหว่างหน้าเว็บ comp_M3.html และสคริปต์พิมพ์ข้อสอบจำลอง)
   ตอน 2 = F (คิดเลขเร็ว/คิดคำนวณ)  ตอน 3 = P (โจทย์ปัญหา)  ตอน 1 = MC (เลือกตอบ ดัดแปลงจาก F/P ที่คำตอบเป็นจำนวนเต็ม)
   ทุกข้อ: gen(g) คืน {q, ans, sol, [ansT], [int]} · g = {R(a,b), pick(arr), r()} */
(function(root){
const mn=x=>String(x).replace(/-/g,'−');
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const lcm=(a,b)=>a/gcd(a,b)*b;
const nzr=(g,a,b)=>{let v=0;while(v===0)v=g.R(a,b);return v};
const sg=n=>n<0?` − ${-n}`:` + ${n}`;

function mkMC(item,g){
 const d=item.gen(g);let a=d.ans;const set=[a],c=[a+1,a-1,a+2,a-2,a+10,a-10,a*2,a+5,a-5,Math.round(a/2)];
 const cand=c.filter(x=>Number.isFinite(x)&&x!==a&&(a<0||x>=0));
 while(set.length<4&&cand.length){const i=Math.floor(g.r()*cand.length);const v=cand.splice(i,1)[0];if(set.indexOf(v)<0)set.push(v)}
 let k=4;while(set.length<4){set.push(a+k);k++}
 for(let i=set.length-1;i>0;i--){const j=Math.floor(g.r()*(i+1));const t=set[i];set[i]=set[j];set[j]=t}
 return{q:d.q,opts:set,key:set.indexOf(a),ans:a,sol:d.sol}
}
function mkG(r){return{r:r,R:(a,b)=>a+Math.floor(r()*(b-a+1)),pick:arr=>arr[Math.floor(r()*arr.length)]}}
function shuf(g,arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(g.r()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}

function buildExam(rngFor,key){
 const g=mkG(rngFor(key+'|pick'));
 const fi=shuf(g,F.map((_,i)=>i)),pi=shuf(g,P.map((_,i)=>i).filter(i=>!P[i][1]||true));
 const f2=fi.slice(0,20),fMC=fi.slice(20);
 const pAns=i=>!(P[i][0]==='ความน่าจะเป็น');
 const pAll=pi.filter(pAns);
 const p3=pi.slice(0,10);
 const mcP=pAll.filter(i=>p3.indexOf(i)<0).slice(0,6);
 const mcF=fMC.slice(0,4);
 const mk=(arr,tag,i,idx)=>({gen:arr[i][1],name:arr[i][0],tag:tag,seed:key+'|'+tag+'|'+idx});
 const part1=[...mcP.map((i,n)=>mk(P,'P',i,'a'+n)),...mcF.map((i,n)=>mk(F,'F',i,'b'+n))].map(o=>{const gg=mkG(rngFor(o.seed));return Object.assign({name:o.name},mkMC({gen:o.gen},gg))});
 const shufd=shuf(g,part1);
 const part2=f2.map((i,n)=>{const o=mk(F,'F',i,'c'+n);return Object.assign({name:o.name},o.gen(mkG(rngFor(o.seed))))});
 const part3=p3.map((i,n)=>{const o=mk(P,'P',i,'d'+n);return Object.assign({name:o.name},o.gen(mkG(rngFor(o.seed))))});
 return{part1:shufd,part2:part2,part3:part3}
}

async function save(strand,toks){const r=await call({action:'save',token:TOKEN,strand:strand,passed:toks,failedAt:''});return r.ok}
function loadStat(){
 const d2=(PROG['LS_COMPDR']||[]).filter(x=>x.indexOf('D2_')===0).length,d3=(PROG['LS_COMPDR']||[]).filter(x=>x.indexOf('D3_')===0).length;
 const sc=(PROG['LS_COMPSC']||[]).map(x=>x.split('_')).filter(a=>a[0][0]==='M').map(a=>`ชุด ${a[0].slice(1)}: ${a[1]} คะแนน`);
 $('stat').innerHTML=`ฝึกตอน 2 แล้ว ${d2} ชุด · ฝึกตอน 3 แล้ว ${d3} ชุด`+(sc.length?` · ผลข้อสอบจำลอง: ${sc.join(', ')}`:' · ยังไม่ได้ทำข้อสอบจำลอง')}
/* ---------- ฝึกทีละข้อ (ตอน 2 / ตอน 3) ---------- */
let SET=null,TIMER=null;
function startDrill(kind){
 const bank=kind==='D2'?COMP.F:COMP.P,n=kind==='D2'?10:5;
 const cnt=(PROG['LS_COMPDR']||[]).filter(x=>x.indexOf(kind+'_'+todayKey()+'_')===0).length+(SET?1:0);
 const idx=COMP.shuf(COMP.mkG(rngFor(ME.id+'|'+kind+'|'+todayKey()+'|'+Date.now())),bank.map((_,i)=>i)).slice(0,n);
 const qs=idx.map((bi,i)=>{const gg=COMP.mkG(rngFor(ME.id+'|'+kind+'|'+todayKey()+'|'+Date.now()+'|'+i));const d=bank[bi][1](gg);d.name=bank[bi][0];return d});
 SET={kind,qs,i:0,ok:0,t0:Date.now(),n};ask()}
function ask(){
 const q=SET.qs[SET.i],n=SET.n;
 $('play').innerHTML=`<div class="muted">${SET.kind==='D2'?'ตอน 2 · คิดเลขเร็ว':'ตอน 3 · โจทย์ปัญหา'} · ข้อ ${SET.i+1}/${n} · ถูกแล้ว ${SET.ok}</div><div class="bq">${mxFr(q.q)}</div><div class="row"><input type="text" class="bin" id="ans" autocomplete="off" inputmode="text" placeholder="คำตอบ"><button class="pri" id="chk">ตรวจ</button></div><div id="fb"></div>`;
 const go=()=>{const v=numIn($('ans').value);if(isNaN(v)){$('fb').innerHTML='<div class="fb no">พิมพ์เป็นตัวเลข เช่น 12, −5, 7/12, 3.5</div>';return}
  const ok=same(v,q.ans);if(ok)SET.ok++;$('ans').disabled=true;$('chk').disabled=true;
  $('fb').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'✓ ถูกต้อง':'✗ ยังไม่ถูก คำตอบที่ถูกคือ <b>'+mxFr(showAns(q))+'</b>'}</div>${ok?'':`<div class="sol2">${mxFr(q.sol)}</div>`}<div style="margin-top:10px"><button class="pri" id="nx">${SET.i<n-1?'ข้อต่อไป':'ดูผลชุดนี้'}</button></div>`;
  $('nx').onclick=()=>{SET.i++;if(SET.i<n)ask();else finishDrill()};$('nx').focus()};
 $('chk').onclick=go;$('ans').onkeydown=e=>{if(e.key==='Enter')go()};$('ans').focus()}
async function finishDrill(){
 const secs=Math.round((Date.now()-SET.t0)/1000),per=Math.round(secs/SET.n);
 const tok=`${SET.kind}_${todayKey()}_${Date.now().toString(36)}_${SET.ok}`;
 (PROG['LS_COMPDR']=PROG['LS_COMPDR']||[]).push(tok);loadStat();
 const goal=SET.kind==='D2'?'เป้าหมายตอน 2: ประมาณ 1 นาทีต่อข้อ ถูกอย่างน้อย 85%':'ตอน 3 ข้อละ 5 คะแนน ให้ฝึกเขียนวิธีคิดลงกระดาษทดทุกข้อ';
 $('play').innerHTML=`<div class="big">${SET.ok}/${SET.n}</div><p>ใช้เวลา ${Math.floor(secs/60)} นาที ${secs%60} วินาที (เฉลี่ย ${per} วินาที/ข้อ) · ${goal}</p><div class="row"><button class="pri" id="again">ทำอีกชุด</button></div><div class="muted" id="sv" style="margin-top:6px">กำลังบันทึก…</div>`;
 $('again').onclick=()=>startDrill(SET.kind);
 const ok=await save('LS_COMPDR',[tok]);$('sv').textContent=ok?'✓ บันทึกแล้ว':'⚠ บันทึกไม่สำเร็จ (ผลชุดนี้อาจไม่ถูกเก็บ)'}
/* ---------- ข้อสอบจำลองเต็มชุด ---------- */
let EXAM=null,MK=0,TMR=null,ENDT=0;
const LAB=['ก','ข','ค','ง'];
function startMock(k){
 MK=k;EXAM=COMP.buildExam(rngFor,ME.id+'|COMPMOCK|'+k);
 let st=Date.now();try{const s=sessionStorage.getItem('comp_mock_'+ME.id+'_'+k);if(s)st=+s;else sessionStorage.setItem('comp_mock_'+ME.id+'_'+k,String(st))}catch(e){}
 ENDT=st+120*60*1000;drawMock();tick();clearInterval(TMR);TMR=setInterval(tick,1000)}
function drawMock(){
 let h=`<div class="row"><span class="timer" id="tm"></span><span class="muted">ชุดที่ ${MK} · ทำบนกระดาษทดก่อนแล้วกรอกคำตอบ (เศษส่วนพิมพ์เช่น 3/5) · ปิดหน้าแล้วเปิดใหม่เวลายังเดินต่อ</span></div>`;
 h+='<h3 class="sec" style="margin-top:12px">ตอนที่ 1 เลือกตอบ (ข้อละ 1 คะแนน)</h3>';
 EXAM.part1.forEach((q,i)=>{h+=`<div class="mq"><div class="ql"><b>${i+1}.</b> ${mxFr(q.q)}</div>${q.opts.map((o,j)=>`<label class="opt"><input type="radio" name="m1_${i}" value="${j}"> ${LAB[j]}. ${mxFr(mn(o))}</label>`).join('')}</div>`});
 h+='<h3 class="sec" style="margin-top:12px">ตอนที่ 2 คิดเลขเร็ว/คิดคำนวณ (ข้อละ 2 คะแนน)</h3>';
 EXAM.part2.forEach((q,i)=>{h+=`<div class="mq"><div class="ql"><b>${i+1}.</b> ${mxFr(q.q)} = <input type="text" id="m2_${i}" autocomplete="off"></div></div>`});
 h+='<h3 class="sec" style="margin-top:12px">ตอนที่ 3 โจทย์ปัญหา (ข้อละ 5 คะแนน)</h3>';
 EXAM.part3.forEach((q,i)=>{h+=`<div class="mq"><div class="ql"><b>${i+1}.</b> ${mxFr(q.q)}</div><div class="row" style="margin-top:6px">คำตอบ <input type="text" id="m3_${i}" autocomplete="off"></div></div>`});
 h+='<div class="row" style="margin-top:12px"><button class="pri" id="sub">ส่งข้อสอบและดูคะแนน</button></div><div id="res"></div>';
 $('play').innerHTML=h;$('sub').onclick=()=>{if(confirm('ส่งข้อสอบตอนนี้ใช่ไหม?'))submitMock()}}
function tick(){const el=$('tm');if(!el)return;const left=Math.max(0,ENDT-Date.now()),m=Math.floor(left/60000),s=Math.floor(left%60000/1000);el.textContent=`เหลือเวลา ${m}:${String(s).padStart(2,'0')} นาที`;if(left<=0&&$('sub')&&!$('sub').disabled){clearInterval(TMR);submitMock()}}
async function submitMock(){
 clearInterval(TMR);$('sub').disabled=true;
 let s1=0,s2=0,s3=0,det='';
 EXAM.part1.forEach((q,i)=>{const r=document.querySelector(`input[name=m1_${i}]:checked`);const ok=r&&+r.value===q.key;if(ok)s1++;det+=rev(`ตอน 1 ข้อ ${i+1}`,q,ok,r?LAB[+r.value]:'-',LAB[q.key]+' ('+mn(q.ans)+')')});
 EXAM.part2.forEach((q,i)=>{const v=numIn($('m2_'+i).value);const ok=!isNaN(v)&&same(v,q.ans);if(ok)s2+=2;det+=rev(`ตอน 2 ข้อ ${i+1}`,q,ok,$('m2_'+i).value||'-',showAns(q))});
 EXAM.part3.forEach((q,i)=>{const v=numIn($('m3_'+i).value);const ok=!isNaN(v)&&same(v,q.ans);if(ok)s3+=5;det+=rev(`ตอน 3 ข้อ ${i+1}`,q,ok,$('m3_'+i).value||'-',showAns(q))});
 const tot=s1+s2+s3,medal=tot>=80?'เหรียญทอง':tot>=70?'เหรียญเงิน':tot>=60?'เหรียญทองแดง':'เกียรติบัตร';
 try{sessionStorage.removeItem('comp_mock_'+ME.id+'_'+MK)}catch(e){}
 $('res').innerHTML=`<div class="tcard" style="background:#f3e5f5;margin-top:12px"><div class="big">${tot}/100</div><p>ตอน 1: ${s1}/10 · ตอน 2: ${s2}/40 · ตอน 3: ${s3}/50 · ระดับ${medal} (เกณฑ์: ทอง ≥ 80, เงิน 70–79, ทองแดง 60–69)</p><div class="muted" id="sv">กำลังบันทึก…</div></div><h3 class="sec">เฉลยและวิธีคิด</h3>${det}`;
 (PROG['LS_COMPSC']=PROG['LS_COMPSC']||[]).push('M'+MK+'_'+tot);loadStat();
 const a=await save('LS_COMP',['M'+MK]);const b=await save('LS_COMPSC',['M'+MK+'_'+tot]);$('sv').textContent=a&&b?'✓ บันทึกคะแนนแล้ว':'⚠ บันทึกไม่สำเร็จ'}
function rev(t,q,ok,mine,key){return `<div class="mq rv ${ok?'ok':'no'}"><div class="ql"><b>${t}</b> ${ok?'✓':'✗'} ตอบ ${mxFr(String(mine))} · เฉลย <b>${mxFr(String(key))}</b></div><div class="sol2">${mxFr(q.q)}</div><div class="sol2">${mxFr(q.sol)}</div></div>`}
$('mD2').onclick=()=>startDrill('D2');$('mD3').onclick=()=>startDrill('D3');
[1,2,3,4].forEach(k=>$('mM'+k).onclick=()=>startMock(k));
$('who').textContent=ME.name;
$('btnQuit').onclick=()=>location.href='MathEQ.html';
(async()=>{const r=await call({action:'me',token:TOKEN});if(r.ok&&r.progress){['LS_COMPDR','LS_COMPSC'].forEach(s=>{if(r.progress[s])PROG[s]=r.progress[s].passed.slice()})}loadStat()})();
</script>
</body></html>
