<style>

<script>
const SID="C";
let API_URL="";try{API_URL=sessionStorage.getItem("matheq_api")||""}catch(e){}
const DEMO=!API_URL;
let TOKEN=null;try{const s=JSON.parse(sessionStorage.getItem("matheq_sess")||"null");TOKEN=s&&s.token}catch(e){}
if(!TOKEN){location.replace("MathEQ.html")}
// ===== คลังข้อสอบสาย N (สร้างข้อจากเลขสุ่ม) =====
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
const sup=n=>String(n).split('').map(c=>SUP[c]).join('');
const sgn=n=>n<0?'−'+(-n):''+n;                       // แสดงเครื่องหมายลบแบบ −
const par=n=>n<0?'(−'+(-n)+')':''+n;                  // ใส่วงเล็บถ้าติดลบ
const frac=(n,d)=>{const g=gcd(n,d);n/=g;d/=g;return d===1?String(n):n+'/'+d};
const fh=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
// mc: correct + wrongs [{t,tag}]
function MC(q,ans,wrongs,exp){
  const seen=new Set([String(ans)]);const w=[];
  for(const x of wrongs){const k=String(x.t);if(!seen.has(k)){seen.add(k);w.push(x)}}
  const fill=[];let i=1;while(w.length+fill.length<3){const t=typeof ans==='number'?ans+i*(i%2?1:-1)*R(1,3):ans+'?'.repeat(i);const k=String(t);if(!seen.has(k)){seen.add(k);fill.push({t,tag:'คำนวณคลาดเคลื่อน'})}i++}
  const ch=shuffle([{t:ans,ok:1},...w.slice(0,3).concat(fill).slice(0,3)]);
  return {type:'mc',q,ans,choices:ch,exp};
}
// num: ตอบพิมพ์ — hints [{v,tag}] เฉพาะคำตอบผิดที่พบบ่อย
function NUM(q,ans,hints,exp){return {type:'num',q,ans:String(ans),hints:hints||[],exp}}


const TB=(head,rows)=>`<table class="t"><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table>`;
const TFL=['จริง','เท็จ','ไม่สามารถบอกได้','ไม่เป็นทั้งจริงและเท็จ'];
function TF(q,v,exp,tag){const ok=v?'จริง':'เท็จ';return MC(q,ok,TFL.filter(x=>x!==ok).map(x=>({t:x,tag:x===(v?'เท็จ':'จริง')?(tag||'ประเมินค่าความจริงผิด'):'ทุกประพจน์มีค่าความจริงแน่นอน'})),exp)}
const sgx=n=>n<0?`− ${-n}`:`+ ${n}`;
const pt=(a,b)=>`(${sgn(a)}, ${sgn(b)})`;
const sg=n=>n<0?`− ${-n}`:`+ ${n}`;


const META={sid:'C',name:'แคลคูลัสเบื้องต้น',base:'ตอนนี้ควรเริ่มซ่อมจากขั้น C0 (การแยกตัวประกอบ การแทนค่าฟังก์ชัน) ก่อน แล้วค่อยไล่ขึ้นไปทีละขั้น',note:p=>'สายนี้เป็นเนื้อหา ม.6 ถ้านักเรียนยังไม่เคยเรียนแคลคูลัส ผลที่ได้เป็นการวัดพื้นฐานก่อนเรียน (C11 อยู่นอกรายวิชาเทอม 2)'};
const fx=(c,p)=>{if(c===0)return '';const a=Math.abs(c);const v=p===0?'':p===1?'x':'x'+sup(p);return (a===1&&p>0)?v:a+v};
const pl=(arr)=>{let s='',f=true;for(const [c,p] of arr){if(c===0)continue;const t=fx(c,p);s+=f?(c<0?'−':'')+t:(c<0?' − ':' + ')+t;f=false}return s||'0'};
var STEPS=[
{id:'C0',name:'ซ่อมฐาน: แยกตัวประกอบ ฟังก์ชัน และกราฟ',gen:[
 ()=>{const k=R(2,9);return MC(`แยกตัวประกอบ x${sup(2)} − ${k*k}`,`(x − ${k})(x + ${k})`,[{t:`(x − ${k})${sup(2)}`,tag:'สับสนผลต่างกำลังสองกับกำลังสองสมบูรณ์'},{t:`(x + ${k})${sup(2)}`,tag:'สับสนผลต่างกำลังสองกับกำลังสองสมบูรณ์'},{t:`(x − ${k*k})(x + 1)`,tag:'ไม่ถอดรากของจำนวน'}],'a² − b² = (a − b)(a + b)')},
 ()=>{let p,q;do{p=R(-5,5);q=R(-5,5)}while(p===q||p===0||q===0||p+q===0);return MC(`แยกตัวประกอบ ${pl([[1,2],[-(p+q),1],[p*q,0]])}`,`(x ${sg(-p)})(x ${sg(-q)})`,[{t:`(x ${sg(p)})(x ${sg(q)})`,tag:'ผิดเครื่องหมายของตัวประกอบ'},{t:`(x ${sg(-p)})(x ${sg(q)})`,tag:'เครื่องหมายตัวประกอบตัวใดตัวหนึ่งผิด'},{t:`(x ${sg(p)})(x ${sg(-q)})`,tag:'เครื่องหมายตัวประกอบตัวใดตัวหนึ่งผิด'}],'หาสองจำนวนที่คูณได้ค่าคงที่และบวกได้สัมประสิทธิ์ของ x')},
 ()=>{const a=R(2,4),b=R(-5,5),c=R(-5,5),k=R(-3,3);return NUM(`ถ้า f(x) = ${pl([[a,2],[b,1],[c,0]])} แล้ว f(${sgn(k)}) เท่ากับเท่าใด`,a*k*k+b*k+c,[{v:a*k*k-b*k+c,tag:'แทนค่าติดลบแล้วเครื่องหมายของพจน์เชิงเส้นผิด'}].filter(h=>h.v!==a*k*k+b*k+c),'แทน x ด้วยค่าที่กำหนดอย่างระวังวงเล็บ')},
 ()=>{const a=R(2,6);return NUM(`ลดรูป (x${sup(2)} − ${a*a})/(x − ${a}) เมื่อ x ≠ ${a} แล้วหาค่าเมื่อ x = 0`,a,[{v:-a,tag:'ผิดเครื่องหมายหลังตัดตัวประกอบ'}],`(x−${a})(x+${a})/(x−${a}) = x + ${a}`)}]},
{id:'C1',name:'ลิมิต: ความหมายและการหาจากตาราง/กราฟ',gen:[
 ()=>{const a=R(1,6),b=R(-3,5);const L=a*2+b;return NUM(`ถ้า f(1.9) = ${(a*1.9+b).toFixed(2)}, f(1.99) = ${(a*1.99+b).toFixed(3)} และ f(2.01) = ${(a*2.01+b).toFixed(3)} (f(x) = ${a}x ${sg(b)}) แล้ว lim<sub>x→2</sub> f(x) เท่ากับเท่าใด`,L,[{v:2,tag:'ตอบค่า x ที่เข้าใกล้ แทนค่าของฟังก์ชัน'}].filter(h=>h.v!==L),'ลิมิตคือค่าที่ f(x) เข้าใกล้เมื่อ x เข้าใกล้ 2')},
 ()=>{const a=R(1,6),b=R(1,6),eq=Math.random()<0.5;const bb=eq?a:a+R(1,3);return MC(`ถ้า lim<sub>x→c⁻</sub> f(x) = ${a} และ lim<sub>x→c⁺</sub> f(x) = ${bb} แล้ว lim<sub>x→c</sub> f(x) เป็นอย่างไร`,eq?`เท่ากับ ${a}`:'ไม่มีค่า',[{t:eq?'ไม่มีค่า':`เท่ากับ ${a}`,tag:'ตัดสินการมีอยู่ของลิมิตผิด (ต้องเท่ากันทั้งสองข้าง)'},{t:`เท่ากับ ${a+bb}`,tag:'บวกลิมิตทั้งสองข้าง'},{t:`เท่ากับ ${bb}${eq?' เท่านั้น':'  เสมอ'}`,tag:'เลือกลิมิตข้างเดียว'}],'ลิมิตมีเมื่อทั้งสองข้างเท่ากัน')},
 ()=>{const k=R(1,5),c=R(-4,4);return NUM(`lim<sub>x→${sgn(c)}</sub> (${k}x + ${k}) เท่ากับเท่าใด`,k*c+k,[{v:k*c,tag:'ลืมพจน์คงที่'}].filter(h=>h.v!==k*c+k),'ฟังก์ชันพหุนามแทนค่าได้ตรง ๆ')},
 ()=>{const c=R(1,5);return MC(`ลิมิตของ f(x) เมื่อ x → ${c} ขึ้นอยู่กับสิ่งใด`,`ค่าที่ f(x) เข้าใกล้เมื่อ x ใกล้ ${c} (ไม่จำเป็นต้องเท่ากับ f(${c}))`,[{t:`ค่า f(${c}) เท่านั้น`,tag:'ลิมิตไม่จำเป็นต้องเท่ากับค่าของฟังก์ชัน ณ จุดนั้น'},{t:`ค่า f(0)`,tag:'ลิมิตขึ้นกับบริเวณใกล้จุดที่กำหนด'},{t:'ค่าสูงสุดของ f',tag:'ไม่เกี่ยวกับค่าสูงสุด'}],'ลิมิตสนใจเฉพาะบริเวณรอบ ๆ จุดนั้น')}]},
{id:'C2',name:'กฎลิมิตและกรณี 0/0',gen:[
 ()=>{const k=R(2,9);return NUM(`lim<sub>x→${k}</sub> (x${sup(2)} − ${k*k})/(x − ${k}) เท่ากับเท่าใด`,2*k,[{v:0,tag:'แทนค่าแล้วได้ 0/0 แต่ตอบ 0 (ต้องตัดตัวประกอบก่อน)'},{v:k,tag:'ตัดตัวประกอบแล้วแทนผิด'}],`(x−${k})(x+${k})/(x−${k}) = x+${k} → ${2*k}`)},
 ()=>{let r,s2;do{r=R(-4,5);s2=R(-4,5)}while(r===s2);return NUM(`lim<sub>x→${sgn(r)}</sub> (${pl([[1,2],[-(r+s2),1],[r*s2,0]])})/(x ${sg(-r)}) เท่ากับเท่าใด`,r-s2,[{v:s2-r,tag:'ผิดเครื่องหมายหลังตัดตัวประกอบ'}],`ตัด (x ${sg(-r)}) ได้ x ${sg(-s2)} แทน x = ${sgn(r)}`)},
 ()=>{const a=R(1,4),b=R(1,4),c=R(1,5);return NUM(`ถ้า lim<sub>x→${c}</sub> f(x) = ${a} และ lim<sub>x→${c}</sub> g(x) = ${b} แล้ว lim<sub>x→${c}</sub> [f(x)·g(x)] เท่ากับเท่าใด`,a*b,[{v:a+b,tag:'บวกลิมิตแทนการคูณ'}],'ลิมิตของผลคูณ = ผลคูณของลิมิต')},
 ()=>{const a=R(2,5);return NUM(`lim<sub>x→0</sub> (${a}x${sup(2)} + ${a}x)/x เท่ากับเท่าใด`,a,[{v:0,tag:'แทน x = 0 ตรง ๆ ได้ 0/0 แต่ตอบ 0'}],`ตัด x ได้ ${a}x + ${a} → ${a}`)}]},
{id:'C3',name:'ความต่อเนื่องของฟังก์ชัน',gen:[
 ()=>{const c=R(2,5),b=R(1,5);const k=c+b;return NUM(`f(x) = x + ${b} เมื่อ x < ${c}, f(x) = k เมื่อ x ≥ ${c} ถ้า f ต่อเนื่องที่ x = ${c} แล้ว k เท่ากับเท่าใด`,k,[{v:c,tag:'ตอบค่า x จุดต่อ แทนค่าลิมิต'}].filter(h=>h.v!==k),'ต้องให้ lim ซ้าย = f(c)')},
 ()=>{const c=R(2,6);return NUM(`f(x) = (x${sup(2)} − ${c*c})/(x − ${c}) เมื่อ x ≠ ${c} กำหนด f(${c}) = k ให้ f ต่อเนื่องที่ x = ${c} ค่า k เท่ากับเท่าใด`,2*c,[{v:0,tag:'ใช้ 0/0 เป็นค่า k แทนการหาลิมิต'}],'k = lim f(x) เมื่อ x → c')},
 ()=>MC('f ต่อเนื่องที่ x = c ต้องมีเงื่อนไขครบข้อใด','f(c) นิยาม, lim f(x) มีค่า และ lim f(x) = f(c)',[{t:'f(c) นิยามเท่านั้น',tag:'เงื่อนไขไม่ครบ'},{t:'lim f(x) มีค่าเท่านั้น',tag:'ต้องมี f(c) และลิมิตเท่ากับ f(c) ด้วย'},{t:'f(c) = 0',tag:'ไม่เกี่ยวกับความต่อเนื่อง'}],'ความต่อเนื่อง 3 เงื่อนไข'),
 ()=>{const c=R(1,5);return MC(`f(x) = 1/(x − ${c}) ต่อเนื่องที่จุดใดไม่ได้`,`x = ${c}`,[{t:'x = 0',tag:'ตรวจตัวส่วนผิดจุด'},{t:`x = ${-c}`,tag:'ผิดเครื่องหมายของจุดที่ตัวส่วนเป็นศูนย์'},{t:'ต่อเนื่องทุกจุด',tag:'ตัวส่วนเป็นศูนย์ทำให้ไม่ต่อเนื่อง'}],'ตัวส่วนเป็นศูนย์ทำให้ f ไม่นิยาม')}]},
{id:'C4',name:'อนุพันธ์จากนิยาม',gen:[

 else if(q.type==='mc'){const c=q.choices[v];ok=!!c.ok;tag=ok?'':(c.tag||'เลือกคำตอบผิด');
  [...document.querySelectorAll('.ch')].forEach((b,ix)=>{b.disabled=true;if(q.choices[ix].ok)b.classList.add('ok');else if(ix===v)b.classList.add('no')})}
 else{const n=parseNum(v);if(isNaN(n)){$('fb').innerHTML='<div class="fb no">พิมพ์ตัวเลขหรือเศษส่วน เช่น 12, −5, 3/4, 0.25</div>';return}
  ok=same(n,parseNum(q.ans));if(!ok){const h=q.hints.find(h=>same(n,parseNum(h.v)));tag=h?h.tag:'คำนวณคลาดเคลื่อน'}
  $('inp').disabled=true;$('sub').disabled=true}
 $('skip').disabled=true;
 if(ok)S.right++;else{S.wrong++;S.wrongTags.push({step:STEPS[S.i].id,tag})}
 const done=S.right>=NEED||S.wrong>=MAXWRONG;
 $('fb').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'✓ ถูกต้อง':'✗ ยังไม่ถูก'+(tag&&v!==null?` — ${tag}`:'')}<br><span class="muted">${q.exp}</span></div><div style="margin-top:10px"><button id="nx">${done?'ต่อไป':'ข้อถัดไป'}</button></div>`;
 $('nx').onclick=()=>{
  if(S.right>=NEED){S.passed.push(S.i);S.i++;S.right=S.wrong=0;S.seen=new Set();if(S.i>=STEPS.length){S.done=true;return finish()}return nextQ()}
  if(S.wrong>=MAXWRONG){S.failed=S.i;S.done=true;return finish()}
  nextQ()}}
async function finish(){
 $('tQ').classList.add('hide');$('tR').classList.remove('hide');
 const ids=S.passed.map(k=>STEPS[k].id),top=ids.length?ids[ids.length-1]:null,nx=S.failed>=0?STEPS[S.failed]:null;
 $('rSub').textContent=`ผลการประเมินตนเอง · สาย ${CUR}`;
 $('rTitle').textContent=top?`ผ่านถึงขั้น ${top}`:'ยังไม่ผ่านขั้น '+STEPS[0].id;
 let d=!top?META.base:!nx?'ผ่านทุกขั้นของสายนี้ — เก่งมาก!':`ขั้นถัดไปที่ควรฝึกคือ <b>${nx.id} · ${nx.name}</b>`;
 const nt=META.note(S.passed);if(nt)d+='<br><span class="muted">'+nt+'</span>';
 $('rDesc').innerHTML=d;
 $('rLadder').innerHTML=STEPS.map((s,k)=>`<span class="chip ${S.passed.includes(k)?'pass':S.failed===k?'fail':''}">${s.id}</span>`).join('');
 const g={};S.wrongTags.forEach(w=>{if(!g[w.tag])g[w.tag]={n:0,steps:new Set()};g[w.tag].n++;g[w.tag].steps.add(w.step)});
 const items=Object.entries(g).filter(([t])=>t&&t!=='ไม่รู้ / ข้าม').map(([t,x])=>`<li>${t} <span class="muted">(${[...x.steps].map(s=>KN.includes(s)?`<a href="kn_${s}.html">${s}</a>`:s).join(', ')})</span></li>`);
 const sk=(g['ไม่รู้ / ข้าม']||{n:0}).n;
 $('rKn').innerHTML=nx&&KN.includes(nx.id)?`<a href="kn_${nx.id}.html"><button class="pri">อ่านใบความรู้ขั้น ${nx.id} ก่อนลองใหม่</button></a>`:'';
 $('rWrong').innerHTML=(items.length?'<ul>'+items.join('')+'</ul>':'<p class="muted">ไม่มีจุดผิดที่ระบุได้</p>')+(sk?`<p class="muted">ข้ามข้อ ${sk} ข้อ</p>`:'');
 $('saveSt').textContent='กำลังบันทึกผล…';
 const r=await call({action:'save',token:TOKEN,strand:CUR,passed:ids,failedAt:nx?nx.id:''});
 if(r.ok){PROG=r.progress;AVG=r.classAvg||AVG;$('saveSt').textContent='✓ บันทึกผลเรียบร้อยแล้ว (ขั้นที่เคยผ่านแล้วจะไม่หายไป)';
  const mp=(PROG[CUR]&&PROG[CUR].passed)||[],mtop=STEPS.filter(s=>mp.includes(s.id)).map(s=>s.id).pop();
  if(mtop){$('rTitle').textContent='ผ่านสะสมถึงขั้น '+mtop;$('rLadder').innerHTML=STEPS.map((s,k)=>`<span class="chip ${mp.includes(s.id)?'pass':(nx&&nx.id===s.id)?'fail':''}">${s.id}</span>`).join('')}}
 else{PROG[CUR]={passed:ids,failedAt:nx?nx.id:'',updated:new Date().toISOString()};$('saveSt').textContent='⚠ บันทึกไม่สำเร็จ — ถ่ายภาพหน้าจอนี้ส่งครู (ผ่านถึง '+(top||'-')+')'}}
$('btnHome').onclick=()=>{location.href='MathEQ.html?s='+CUR};
$('btnQuit').onclick=()=>{if(S&&S.n&&!S.done&&!confirm('ออกกลางคัน ผลจะไม่ถูกบันทึก ต้องการออกหรือไม่?'))return;location.href='MathEQ.html?s='+CUR};


if(TOKEN){call({action:'me',token:TOKEN}).then(r=>{if(r&&r.ok){PROG=r.progress||{};AVG=r.classAvg||AVG}openTest(SID)})}
</script></body></html>
