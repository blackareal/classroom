(function(){try{var st=document.createElement('style');st.textContent='.rd{white-space:nowrap}.rr{border-top:.075em solid currentColor;padding:0 .1em 0 .06em;margin-left:.02em}';(document.head||document.documentElement).appendChild(st)}catch(e){}})();
function mxRt(s){
 if(s.indexOf('\u221a')<0)return s;
 s=s.replace(/\u221a\(([^()]*)\)/g,function(m,x){return '<span class="rd">\u221a<span class="rr">'+x+'</span></span>'});
 return s.replace(/\u221a(\d+(?:\.\d+)?|[A-Za-z]+)/g,function(m,x){return '<span class="rd">\u221a<span class="rr">'+x+'</span></span>'});
}
/* MathEQ: เศษส่วนแบบบน-ล่าง + วิธีทำที่เครื่องหมาย = ตรงกัน (ใช้ทุกหน้า) — ไม่ใช้ lookbehind เพื่อรองรับ iOS รุ่นเก่า */
function mxFrText(s){
 s=mxRt(s);
 s=s.replace(/(\([^()]*\)|[A-Za-z0-9]+!)\/(\([^()]*\)!|[A-Za-z0-9]+!)/g,function(m,n,d){var nu=n.charAt(0)==='('?n.slice(1,-1):n,de=d.charAt(0)==='('?d.slice(1,-2)+'!':d;if(n.charAt(0)==='('&&n.indexOf('!')<0)return m;return '<span class="fr"><i>'+nu+'</i><i>'+(d.charAt(0)==='('?'('+d.slice(1,-2)+')!':d)+'</i></span>'});
 s=s.replace(/(^|[^\w\/.])([A-Za-z])\/(\d+)(?![\d\/\u00b2\u00b3])/g,function(m,p,v,d){return p+'<span class="fr"><i>'+v+'</i><i>'+d+'</i></span>'});
 return s.replace(/(?:(\d+) )?(\d+)\/(\d+)/g,function(m,w,n,d,o,str){
  var b=o>0?str.charAt(o-1):'',a=str.charAt(o+m.length);
  if(/[\w\/.√)\]²³′π]/.test(b)||/[\d\/²³√]/.test(a))return m;
  return (w?w:'')+'<span class="fr"><i>'+n+'</i><i>'+d+'</i></span>'});
}
/* รับ HTML string คืน HTML string (ไม่แตะข้างในแท็ก) */
function mxFr(h){
 return String(h).split(/(<\/?[a-zA-Z][^>]*>)/).map(function(x){return x.charAt(0)==='<'&&/^<\/?[a-zA-Z]/.test(x)?x:mxFrText(x)}).join('');
}
/* rows = [[ข้อความซ้าย, ข้อความขวา, ไม่แสดง =], ...] เฉพาะแถวสุดท้ายตัวหนา */
function mxEq(rows){
 var n=rows.length;
 return '<table class="eqt">'+rows.map(function(r,i){return '<tr><td class="el">'+mxFr(r[0]||'')+'</td><td class="ee">'+(r[2]?'':'=')+'</td><td class="er">'+(i===n-1?'<b>'+mxFr(r[1])+'</b>':mxFr(r[1]))+'</td></tr>'}).join('')+'</table>';
}
function mxSplitEq(line){
 var parts=[],depth=0,inTag=false,start=0,i,ch;
 for(i=0;i<line.length;i++){
  ch=line.charAt(i);
  if(ch==='<'&&/[a-zA-Z\/]/.test(line.charAt(i+1)))inTag=true;
  else if(ch==='>'&&inTag)inTag=false;
  if(inTag)continue;
  if('([{'.indexOf(ch)>=0)depth++;
  else if(')]}'.indexOf(ch)>=0)depth--;
  else if(depth===0&&ch==='='&&line.charAt(i-1)===' '&&line.charAt(i+1)===' '){parts.push(line.slice(start,i-1));start=i+2}
 }
 parts.push(line.slice(start));
 return parts;
}
function mxTagsOk(s){
 var o=(s.match(/<[a-zA-Z][^>]*>/g)||[]).length,c=(s.match(/<\/[a-zA-Z]+>/g)||[]).length;
 return o===c;
}
function mxPlain(s){return s.replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')}
function mxCommaFree(pt){
 var d=0,j,c;
 for(j=0;j<pt.length;j++){c=pt.charAt(j);if('([{'.indexOf(c)>=0)d++;else if(')]}'.indexOf(c)>=0)d--;else if(d===0&&c===',')return false}
 return true;
}
/* ตรวจชิ้นส่วนของสายสมการ: แต่ละชิ้นต้องไม่ว่าง แท็กครบคู่ ไม่มีจุลภาคระดับนอก และชิ้นกลางไม่ใช่ "ประโยคใหม่" ติดมา */
function mxPartsOk(p){
 for(var i=0;i<p.length;i++){
  var pt=mxPlain(p[i]).trim();
  if(!pt||!mxTagsOk(p[i])||!mxCommaFree(pt))return false;
  if(i>0&&i<p.length-1&&/[\w)\]²³′″]\s+[A-Za-zα-ωπ][A-Za-z0-9α-ωπ′″]*(\([^()]*\))?$/.test(pt))return false;
 }
 return true;
}
function mxChainTable(p){
 return '<table class="eqt">'+p.map(function(x,i){return '<tr><td class="el"></td><td class="ee">'+(i===0?'':'=')+'</td><td class="er">'+x.trim()+'</td></tr>'}).join('')+'</table>';
}
function mxRowsTable(rows){
 return '<table class="eqt">'+rows.map(function(r){return '<tr><td class="el">'+r[0].trim()+'</td><td class="ee">=</td><td class="er">'+r[1].trim()+'</td></tr>'}).join('')+'</table>';
}
/* segs = รายการ "ประโยคสมการ" ที่แยกกันด้วย → หรือ · (ตัวคั่นแบบเว้นกว้าง) */
function mxStmts(segs,allowChain){
 var allOne=true,allChain=true,parsed=[],i,p;
 for(i=0;i<segs.length;i++){
  p=mxSplitEq(segs[i]);
  if(!mxPartsOk(p))return null;
  parsed.push(p);
  if(p.length!==2)allOne=false;
  if(p.length<3)allChain=false;
 }
 if(allOne)return mxRowsTable(parsed);
 if(allowChain&&allChain)return parsed.map(mxChainTable).join('');
 return null;
}
/* คืน HTML ตาราง ถ้าบรรทัดนี้เป็นสายสมการล้วน ไม่งั้นคืน null */
var MX_SEP=/(?:&nbsp;| ){2,}·(?:&nbsp;| ){2,}/;
function mxThaiLhsOnly(segs){
 for(var i=0;i<segs.length;i++){
  var p=mxSplitEq(segs[i]);
  for(var j=1;j<p.length;j++)if(/[\u0e00-\u0e7f]/.test(mxPlain(p[j])))return false;
 }
 return true;
}
function mxThaiN(x){var m=mxPlain(x).match(/[\u0e00-\u0e7f]/g);return m?m.length:0}
/* สายขั้นตอนที่คั่นด้วย → มีคำไทยสั้น ๆ ปนได้: ขั้นที่มี = ครั้งเดียวเรียงเป็นแถวให้ = ตรงกัน ขั้นอื่นเป็นแถวข้อความ */
function mxArrowRows(line){
 var steps=line.split(/\s+\u2192\s+/),rows=[],eq=0,i,j,p,t;
 if(steps.length<2)return null;
 for(i=0;i<steps.length;i++){
  if(!mxTagsOk(steps[i]))return null;
  p=mxSplitEq(steps[i]);
  if(p.length===2){
   if(!mxCommaFree(mxPlain(p[0]))||mxThaiN(p[0])>12||mxThaiN(p[1])>12||!mxPlain(p[0]).trim()||!mxPlain(p[1]).trim())return null;
   if(/[\w)\]]\s+[A-Za-z]\w*$/.test(mxPlain(p[0]).trim())&&/[0-9]\s+[A-Za-z]/.test(mxPlain(p[0])))return null;
   rows.push('<tr><td class="el">'+p[0].trim()+'</td><td class="ee">=</td><td class="er">'+p[1].trim()+'</td></tr>');eq++;
  }else if(p.length===1){
   t=mxPlain(steps[i]).trim();
   if(!t||t.length>34)return null;
   rows.push('<tr><td colspan="3" style="text-align:left">'+steps[i].trim()+'</td></tr>');
  }else return null;
 }
 if(eq<2)return null;
 return '<table class="eqt">'+rows.join('')+'</table>';
}
function mxChain(line){
 line=line.replace(/<\/?(?:b|strong)>/gi,'');
 var t=mxPlain(line),thai=/[\u0e00-\u0e7f]/.test(t);
 if(/[\u21d2\u21d4\u2194;]/.test(t))return null;
 if(t.indexOf(' = ')<0)return null;
 var segs=line.split(MX_SEP);
 if(segs.length>1){
  for(var k=0;k<segs.length;k++)if(/\s\u2192\s/.test(mxPlain(segs[k])))return null;
  if(thai&&!mxThaiLhsOnly(segs))return null;
  return mxStmts(segs,true);
 }
 if(/\s\u2192\s/.test(t)){
  var as=line.split(/\s+\u2192\s+/);
  if(!thai||mxThaiLhsOnly(as)){var r=mxStmts(as,false);if(r)return r}
  return mxArrowRows(line);
 }
 var p=mxSplitEq(line);
 if(thai&&!mxThaiLhsOnly([line]))return null;
 if(p.length<3||!mxPartsOk(p))return null;
 return mxChainTable(p);
}
var MX_BLOCK='table,p,li,div,ul,ol,details,h1,h2,h3';
var MX_SKIP='button,.ch,#ans,#q,input,textarea,.eqt,svg,script,style,.nomfx';
function mxFix(root){
 var els=root.querySelectorAll('p,li,div.sol,.fb,details>div,.mfx'),k;
 for(k=0;k<els.length;k++){
  var el=els[k];
  if(el.closest(MX_SKIP)||el.querySelector(MX_BLOCK))continue;
  var html=el.innerHTML;
  if(html.indexOf(' = ')<0)continue;
  var lines=html.split(/<br\s*\/?>/i),out=[],raw=[],changed=false;
  for(var i=0;i<lines.length;i++){
   var tb=mxChain(lines[i]);
   if(tb){if(raw.length){out.push(raw.join('<br>'));raw=[]}out.push(tb);changed=true}
   else raw.push(lines[i]);
  }
  if(!changed)continue;
  if(raw.length)out.push(raw.join('<br>'));
  el.innerHTML=out.join('');
 }
 /* เศษส่วนบน-ล่าง ในข้อความทุกที่ (ยกเว้น svg/script/style/ช่องกรอก) */
 var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),nodes=[],n;
 while((n=w.nextNode())){
  if(!/\d\/\d|\u221a/.test(n.nodeValue))continue;
  var pe=n.parentNode;
  if(!pe||(pe.closest&&pe.closest('svg,script,style,textarea,.fr,.nomfx,#saveSt,#rDesc,#rTitle,#gProg,#stepName,#rSub')))continue;
  nodes.push(n);
 }
 nodes.forEach(function(nd){
  var t=nd.nodeValue.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  var h=mxFrText(t);
  if(h===t)return;
  var sp=document.createElement('span');sp.innerHTML=h;
  var frag=document.createDocumentFragment();
  while(sp.firstChild)frag.appendChild(sp.firstChild);
  nd.parentNode.replaceChild(frag,nd);
 });
}
(function(){
 var timer=null,obs=null;
 function run(){try{mxFix(document.body)}catch(e){if(window.console)console.error('mxFix',e)}if(obs)obs.takeRecords()}
 function sched(){clearTimeout(timer);timer=setTimeout(run,30)}
 function start(){
  run();
  if(window.MutationObserver){obs=new MutationObserver(sched);obs.observe(document.body,{childList:true,subtree:true,characterData:true})}
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();

<script>

  return{ok:true,token:body.id,student:{id:body.id,name:s.name,cls:s.cls,no:s.no},progress:d[body.id]||{},classAvg:demoAvg(s.cls)}}
 if(body.action==='me'){if(!DEMO_ROSTER[body.token])return{ok:false,error:'เซสชันหมดอายุ'};const s=DEMO_ROSTER[body.token];return{ok:true,student:{id:body.token,name:s.name,cls:s.cls,no:s.no},progress:d[body.token]||{},classAvg:demoAvg(s.cls)}}
 if(body.action==='save'){d[body.token]=d[body.token]||{};{const o=d[body.token][body.strand],m=o?o.passed.slice():[];body.passed.forEach(x=>{if(m.indexOf(x)<0)m.push(x)});let fl=(body.failedAt?String(body.failedAt).split(','):[]).filter(x=>m.indexOf(x)<0);if(!fl.length&&o&&o.failedAt&&body.failedAt&&body.strand!=='GCX')fl=String(o.failedAt).split(',').filter(x=>m.indexOf(x)<0);d[body.token][body.strand]={passed:m,failedAt:fl.join(','),updated:new Date().toISOString()}}demoSave(d);return{ok:true,progress:d[body.token],classAvg:demoAvg(DEMO_ROSTER[body.token].cls)}}
 if(body.action==='adminLogin')return body.password==='demo'?{ok:true,token:'demo'}:{ok:false,error:'รหัสผ่านครูไม่ถูกต้อง (โหมดทดลอง: demo)'};
 if(body.action==='adminData')return{ok:true,students:Object.keys(DEMO_ROSTER).map(id=>({id,name:DEMO_ROSTER[id].name,cls:DEMO_ROSTER[id].cls,no:DEMO_ROSTER[id].no,progress:d[id]||{}}))};
 if(body.action==='adminMark'){d[body.id]=d[body.id]||{};if(body.on)d[body.id][body.strand]={passed:['CK'],failedAt:'',updated:new Date().toISOString()};else delete d[body.id][body.strand];demoSave(d);return{ok:true}}
 if(body.action==='adminReset'){if(d[body.id])delete d[body.id][body.strand];demoSave(d);return{ok:true}}
}
async function call(body,errEl){try{const r=await api(body);if(!r.ok&&errEl)errEl.textContent=r.error||'เกิดข้อผิดพลาด';return r}catch(e){if(errEl)errEl.textContent='เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง';return{ok:false}}}


function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return(h^=h>>>16)>>>0}}
function rngFor(key){const seed=hashStr(key)();let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const numIn=s=>{s=String(s).trim().replace(/−|–/g,'-').replace(/,/g,'').replace(/[๐-๙]/g,c=>'๐๑๒๓๔๕๖๗๘๙'.indexOf(c)).replace(/\s+/g,'');if(!s)return NaN;const m=s.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);if(m)return +m[1]/+m[2];return /^-?\d+(\.\d+)?$/.test(s)?+s:NaN};
const mn=x=>String(x).replace(/-/g,'−');
const r1=x=>Math.round(x*10)/10;
const LV=[
 ['บวก (ไม่ทด)',g=>{const a1=g.R(0,8),b1=g.R(0,9-a1),a2=g.R(1,8),b2=g.R(1,9-a2);const a=a2*10+a1,b=b2*10+b1;return{q:`${a} + ${b} = ?`,ans:a+b}}],
 ['บวก (มีทด)',g=>{let a,b;do{a=g.R(15,89);b=g.R(15,89)}while(a%10+b%10<10);return{q:`${a} + ${b} = ?`,ans:a+b}}],
 ['ลบ (ไม่ต้องยืม)',g=>{const a1=g.R(1,9),b1=g.R(0,a1),a2=g.R(2,9),b2=g.R(1,a2-1);const a=a2*10+a1,b=b2*10+b1;return{q:`${a} − ${b} = ?`,ans:a-b}}],
 ['ลบ (มียืม)',g=>{let a,b;do{a=g.R(31,99);b=g.R(12,a-10)}while(a%10>=b%10);return{q:`${a} − ${b} = ?`,ans:a-b}}],
 ['สูตรคูณ',g=>{const a=g.R(2,9),b=g.R(2,9);return{q:`${a} × ${b} = ?`,ans:a*b}}],
 ['คูณเลขหลายหลัก',g=>{const a=g.R(12,99),b=g.R(2,9);return{q:`${a} × ${b} = ?`,ans:a*b}}],
 ['หาร (สูตรคูณ)',g=>{const m=g.R(2,9),k=g.R(2,9);return{q:`${m*k} ÷ ${m} = ?`,ans:k}}],
 ['หารเลขหลายหลัก',g=>{const m=g.R(2,9),k=g.R(11,60);return{q:`${m*k} ÷ ${m} = ?`,ans:k}}],
 ['บวก ลบ คูณ หาร ผสม',g=>{const t=g.R(0,2),a=g.R(2,9),b=g.R(2,9),c=g.R(2,9);if(t===0)return{q:`${a} + (${b} × ${c}) = ?`,ans:a+b*c};if(t===1)return{q:`(${a} + ${b}) × ${c} = ?`,ans:(a+b)*c};return{q:`(${a*b} ÷ ${b}) + ${c} = ?`,ans:a+c}}],
 ['เศษส่วน (ส่วนเท่ากัน)',g=>{const d=g.R(4,12),a=g.R(1,d-2),b=g.R(1,d-a-1);if(g.R(0,1))return{q:`${a}/${d} + ${b}/${d} = ? (ตอบเป็นเศษส่วน เช่น 3/7)`,ans:(a+b)/d};return{q:`${a+b}/${d} − ${b}/${d} = ? (ตอบเป็นเศษส่วน เช่น 3/7)`,ans:a/d}}],
 ['ทศนิยม',g=>{const a=g.R(11,99)/10,b=g.R(11,99)/10;if(g.R(0,1))return{q:`${a} + ${b} = ?`,ans:r1(a+b)};const hi=Math.max(a,b),lo=Math.min(a,b);return{q:`${hi} − ${lo} = ?`,ans:r1(hi-lo)}}],
 ['จำนวนเต็มลบ',g=>{const a=g.R(2,15),b=g.R(2,15),t=g.R(0,3);if(t===0)return{q:`(−${a}) + ${b} = ?`,ans:b-a};if(t===1)return{q:`${a} − ${a+b} = ?`,ans:-b};if(t===2)return{q:`(−${a}) + (−${b}) = ?`,ans:-(a+b)};return{q:`(−${a}) − (−${b}) = ?`,ans:b-a}}]
];
const todayKey=()=>{const d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')};
let DONE=new Set(),SET=null;
function curLevel(){for(let i=0;i<LV.length;i++)if(!DONE.has('L'+(i+1)))return i;return -1}
function setsToday(){return [...DONE].filter(x=>x.indexOf('S'+todayKey()+'_')===0).length}
function drawTop(){
 const c=curLevel();
 $('lv').innerHTML=LV.map((l,i)=>`<span class="chip ${DONE.has('L'+(i+1))?'pass':(i===c?'cur':'')}" title="${l[0]}">${i+1}</span>`).join('');
 const n=setsToday();$('today').innerHTML=`วันนี้ทำแล้ว ${Math.min(n,3)}/3 ชุด (${Math.min(n,3)*10}/30 ข้อ)`+(n>=3?' · ครบเป้าหมายวันนี้แล้ว ทำต่อได้อีก':'')+(c>=0?` · ระดับตอนนี้ <b>${c+1}. ${LV[c][0]}</b>`:' · ผ่านทุกระดับแล้ว ฝึกทบทวนแบบสุ่ม')}
function start(){
 const c=curLevel(),n=setsToday();
 const lvl=c>=0?c:Math.floor(rngFor(ME.id+'|'+todayKey()+'|'+n)()*LV.length);
 const qs=[];
 for(let i=0;i<10;i++){const r=rngFor(ME.id+'|'+todayKey()+'|'+n+'|'+lvl+'|'+i);const g={R:(a,b)=>a+Math.floor(r()*(b-a+1))};qs.push(LV[lvl][1](g))}
 SET={lvl,qs,i:0,ok:0,n};drawTop();ask()}
function ask(){
 const q=SET.qs[SET.i];
 $('play').innerHTML=`<div class="muted">ระดับ ${SET.lvl+1}. ${LV[SET.lvl][0]} · ข้อ ${SET.i+1}/10 · ถูกแล้ว ${SET.ok}</div><div class="bq">${mxFr(q.q)}</div><div class="row"><input type="text" class="bin" id="ans" autocomplete="off" inputmode="text" placeholder="คำตอบ"><button class="pri" id="chk">ตรวจ</button></div><div id="fb"></div>`;
 const go=()=>{const v=numIn($('ans').value);if(isNaN(v)){$('fb').innerHTML='<div class="fb no">พิมพ์เป็นตัวเลข เช่น 12, −5, 7/12, 3.5</div>';return}
  const ok=Math.abs(v-q.ans)<1e-6;if(ok)SET.ok++;$('ans').disabled=true;$('chk').disabled=true;
  const shown=Number.isInteger(q.ans)||String(q.ans).length<6?mn(q.ans):mn(Math.round(q.ans*100)/100);
  $('fb').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'✓ ถูกต้อง':'✗ ยังไม่ถูก คำตอบที่ถูกคือ <b>'+shown+'</b>'}</div><div style="margin-top:10px"><button class="pri" id="nx">${SET.i<9?'ข้อต่อไป':'ดูผลชุดนี้'}</button></div>`;
  $('nx').onclick=()=>{SET.i++;if(SET.i<10)ask();else finish()};$('nx').focus()};
 $('chk').onclick=go;$('ans').onkeydown=e=>{if(e.key==='Enter')go()};$('ans').focus()}
async function finish(){
 const pass=SET.ok>=9&&curLevel()===SET.lvl;const toks=['S'+todayKey()+'_'+(SET.n+1)+'_'+SET.lvl];if(pass)toks.push('L'+(SET.lvl+1));
 toks.forEach(x=>DONE.add(x));drawTop();
 $('play').innerHTML=`<div class="big">${SET.ok}/10</div><p>${pass?'<b>ผ่านระดับนี้แล้ว เก่งมาก!</b> เลื่อนไประดับถัดไป':SET.ok>=9?'เก่งมาก!':SET.ok>=7?'ใกล้แล้ว ลองอีกชุดนะ (ต้องได้ 9/10 จึงเลื่อนระดับ)':'ไม่เป็นไร ค่อย ๆ ฝึก ลองอีกชุดได้เลย (ต้องได้ 9/10 จึงเลื่อนระดับ)'}</p><div class="row"><button class="pri" id="again">ทำอีกชุด</button><button id="home2">กลับ MathEQ</button></div><div class="muted" id="sv" style="margin-top:6px">กำลังบันทึก…</div>`;
 $('again').onclick=start;$('home2').onclick=()=>location.href='MathEQ.html';
 const r=await call({action:'save',token:TOKEN,strand:LESSON,passed:toks,failedAt:''});$('sv').textContent=r.ok?'✓ บันทึกแล้ว':'⚠ บันทึกไม่สำเร็จ (ผลชุดนี้อาจไม่ถูกเก็บ)'}
$('who').textContent=ME.name;
$('btnQuit').onclick=()=>location.href='MathEQ.html';
(async()=>{const r=await call({action:'me',token:TOKEN});if(r.ok&&r.progress&&r.progress[LESSON])r.progress[LESSON].passed.forEach(x=>DONE.add(x));start()})();
</script>
